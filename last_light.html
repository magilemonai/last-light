    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        r = Math.min(r, w/2, h/2);
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
    };
}

// Which upgrades to offer each night (pairs or triples)
function getUpgradeChoices(night) {
    const all = ['lensPolish', 'oilReserve', 'fogHorn', 'stormShutters', 'spyglass', 'logBook'];
    // Filter out already-chosen upgrades (each can be picked multiple times for stacking, except abilities)
    const abilities = campaign.upgrades.filter(u => u === 'fogHorn' || u === 'spyglass');
    const available = all.filter(u => {
        if ((u === 'fogHorn' || u === 'spyglass') && abilities.includes(u)) return false;
        return true;
    });
    // Shuffle and pick 2-3
    for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
    }
    return available.slice(0, night < 5 ? 2 : 3);
}

let upgradeChoices = [];
let upgradeSelected = -1;

function applyUpgrades() {
    // Reset to base values then apply all upgrades
    let lensCount = campaign.upgrades.filter(u => u === 'lensPolish').length;
    let oilCount = campaign.upgrades.filter(u => u === 'oilReserve').length;
    let shutterCount = campaign.upgrades.filter(u => u === 'stormShutters').length;
    // Lens Polish: beam brightness (applied as cone angle bonus)
    CFG.beam.coneAngle = 0.38 * (1 + lensCount * 0.1);
    // Oil Reserve: max fuel
    CFG.beam.fuelMax = 100 * (1 + oilCount * 0.15);
    // Storm Shutters: shade speed reduction
    CFG.creatures.shadeSpeed = 25 * Math.pow(0.7, shutterCount);
}

function getJournalEntry(nightIdx) {
    // Weeks 1-2: use pre-written entries
    if (nightIdx < 13 && JOURNAL_ENTRIES[nightIdx]) {
        return JOURNAL_ENTRIES[nightIdx];
    }
    // Week 3: generate from player's night
    const result = campaign.nightResults[nightIdx];
    if (!result) return null;
    const total = result.saved + result.lost;
    if (total === 0) return 'A quiet night. Almost too quiet.';

    const phrases = [];
    if (result.saved > 0) phrases.push(`${result.saved} vessel${result.saved > 1 ? 's' : ''} guided safe`);
    if (result.lost > 0) phrases.push(`${result.lost} met the rocks`);
    if (result.passengersLost > 0) phrases.push('The passenger vessel did not make it');

    let entry = phrases.join('. ') + '.';

    // Add atmospheric flavor for week 3
    const flavors = [
        ' The beam felt weaker tonight.',
        ' Something watched from the north channel.',
        ' The darkness presses closer each night.',
        ' I heard the horn of a ship that was not there.',
        ' The lighthouse groaned in the wind. Or not the wind.',
        ' Dawn took longer to arrive.',
        ' The water was unnaturally still afterward.',
    ];
    entry += flavors[nightIdx % flavors.length];
    return entry;
}

// ── Whisper System ──
const WHISPER_FRAGMENTS = [
    'remember', 'the bargain', 'was made', 'before you',
    'the light', 'holds them', 'but calls', 'them too',
    'we chose', 'to stay', 'the dark', 'is not',
    'empty', 'it waits', 'it watches', 'with patience',
    'the shore', 'remembers', 'every keeper', 'every light',
    'that failed', 'and every', 'light that', 'held'
];

let activeWhispers = []; // {x, y, text, life, maxLife, collected}
let whisperNextIndex = 0; // which fragment to spawn next

function updateWhispers(dt) {
    // Only spawn whispers from Night 8 onward
    if (nightNum < 7) return;

    // Chance to spawn a whisper when beam is over empty water
    if (whisperNextIndex < WHISPER_FRAGMENTS.length && Math.random() < 0.003) {
        // Check beam is over empty water (no entities nearby)
        const checkDist = beam.getLength() * (0.3 + Math.random() * 0.5);
        const checkX = lighthouse.lightX + Math.cos(beam.angle) * checkDist;
        const checkY = lighthouse.lightY + Math.sin(beam.angle) * checkDist;

        let nearEntity = false;
        for (const s of ships) {
            if (Math.sqrt((s.x - checkX) ** 2 + (s.y - checkY) ** 2) < 80) { nearEntity = true; break; }
        }
        for (const c of creatures) {
            if (Math.sqrt((c.x - checkX) ** 2 + (c.y - checkY) ** 2) < 80) { nearEntity = true; break; }
        }

        if (!nearEntity && activeWhispers.length < 3) {
            activeWhispers.push({
                x: checkX + (Math.random() - 0.5) * 40,
                y: checkY + (Math.random() - 0.5) * 20,
                text: WHISPER_FRAGMENTS[whisperNextIndex],
                life: 4.0,
                maxLife: 4.0,
                collected: false,
                index: whisperNextIndex,
            });
            whisperNextIndex++;
        }
    }

    // Update active whispers
    for (let i = activeWhispers.length - 1; i >= 0; i--) {
        const w = activeWhispers[i];
        w.life -= dt;
        w.y -= 8 * dt; // float upward slowly

        // Check if beam is illuminating the whisper
        if (!w.collected && beam.isPointIlluminated(w.x, w.y) > 0.15) {
            w.collected = true;
            if (!campaign.whispersCollected.includes(w.text)) {
                campaign.whispersCollected.push(w.text);
            }
        }

        if (w.life <= 0) {
            activeWhispers.splice(i, 1);
        }
    }
}

function renderWhispers() {
    for (const w of activeWhispers) {
        const ill = beam.isPointIlluminated(w.x, w.y);
        const lifeAlpha = w.life > 3 ? (w.maxLife - w.life) / 1 : w.life > 1 ? 1 : w.life;
        const alpha = Math.max(0.02, ill * 0.6) * lifeAlpha;

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = w.collected ? '#9988bb' : '#665588';
        ctx.font = `italic ${Math.min(14, W * 0.02)}px Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(w.text, w.x, w.y);
        ctx.restore();
    }
}

// ── Input ──
const input = {
    mx: W / 2, my: H / 4,
    mouseDown: false,
    keys: {},
    touched: false,
    touchCount: 0,
    init() {
        canvas.addEventListener('mousemove', e => { this.mx = e.clientX; this.my = e.clientY; });
        canvas.addEventListener('mousedown', e => { this.mouseDown = true; this.handleClick(); });
        canvas.addEventListener('mouseup', e => { this.mouseDown = false; });
        window.addEventListener('keydown', e => {
            this.keys[e.code] = true;
            if (e.code === 'Enter' || e.code === 'Space') this.handleClick();
        });
        window.addEventListener('keyup', e => { this.keys[e.code] = false; });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            this.touched = true;
            this.touchCount = e.touches.length;
            const t = e.touches[0];
            this.mx = t.clientX; this.my = t.clientY;
            this.mouseDown = true;
            this.handleClick();
        }, { passive: false });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            this.mx = t.clientX; this.my = t.clientY;
        }, { passive: false });
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            this.mouseDown = false;
            this.touchCount = e.touches.length;
        }, { passive: false });
        window.addEventListener('blur', () => { this.keys = {}; this.mouseDown = false; });
    },
    handleClick() {
        if (state === GameState.TITLE) {
            nightNum = 0;
            campaign.nightResults = [];
            campaign.upgrades = [];
            campaign.totalSaved = 0;
            campaign.totalLost = 0;
            campaign.whispersCollected = [];
            campaign.finalChoice = null;
            // Reset upgradeable values
            CFG.beam.coneAngle = 0.38;
            CFG.beam.fuelMax = 100;
            CFG.creatures.shadeSpeed = 25;
            changeState(GameState.NIGHT_INTRO, 1.0);
        } else if (state === GameState.DAWN) {
            if (stateTimer > 2.0) {
                if (nightNum < CFG.nights.length) {
                    // Go to upgrade selection (skip for final night / after last night)
                    upgradeChoices = getUpgradeChoices(nightNum);
                    upgradeSelected = -1;
                    changeState(GameState.UPGRADE, 0.8);
                } else {
                    changeState(GameState.KEEPERS_RECORD, 2.0);
                }
            }
        } else if (state === GameState.UPGRADE) {
            if (upgradeSelected >= 0 && stateTimer > 0.5) {
                // Apply chosen upgrade
                const chosen = upgradeChoices[upgradeSelected];
                campaign.upgrades.push(chosen);
                applyUpgrades();
                changeState(GameState.NIGHT_INTRO, 1.0);
            } else {
                // Check if clicking on an upgrade option
                const optionH = 60;
                const startY = H * 0.35;
                for (let i = 0; i < upgradeChoices.length; i++) {
                    const y = startY + i * (optionH + 15);
                    if (this.my >= y && this.my <= y + optionH &&
                        this.mx >= W * 0.2 && this.mx <= W * 0.8) {
                        upgradeSelected = i;
                    }
                }
            }
        } else if (state === GameState.FINALE_CHOICE) {
            if (finaleChoiceHover === 0) {
                campaign.finalChoice = 'relight';
                state = GameState.FINALE_END;
                stateTimer = 0;
            } else if (finaleChoiceHover === 1) {
                campaign.finalChoice = 'leave';
                state = GameState.FINALE_END;
                stateTimer = 0;
            }
        } else if (state === GameState.KEEPERS_RECORD) {
            if (stateTimer > 3.0) {
                changeState(GameState.TITLE, 2.0);
            }
        }
    },
    get overdrive() {
        return this.keys['Space'] || this.touchCount >= 2;
    },
    get fogHornKey() { return this.keys['KeyF']; },
    get spyglassKey() { return this.keys['KeyG']; }
};
input.init();

// ── State Transitions ──
function changeState(to, duration = 0.8) {
    transitionFrom = state;
    transitionTo = to;
    transitionDuration = duration;
    stateTimer = 0;
    state = GameState.TRANSITION;
}

function onStateEnter(s) {
    stateTimer = 0;
    if (s === GameState.NIGHT_INTRO) {
        startNight();
    }
}

// ── Perlin-ish Noise ──
const perm = new Uint8Array(512);
(function initNoise() {
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
})();

function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function lerp(a, b, t) { return a + t * (b - a); }
function grad(hash, x, y) {
    const h = hash & 3;
    return ((h & 1) ? -x : x) + ((h & 2) ? -y : y);
}
function noise2d(x, y) {
    const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    const aa = perm[perm[xi] + yi], ab = perm[perm[xi] + yi + 1];
    const ba = perm[perm[xi + 1] + yi], bb = perm[perm[xi + 1] + yi + 1];
    return lerp(lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u),
                lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u), v);
}

// ── Easing ──
const ease = {
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2,
    outBack: t => { const c = 1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); },
    inQuad: t => t * t,
};

// ── Particle System ──
const particles = [];
const MAX_PARTICLES = 400;

function spawnParticle(x, y, opts = {}) {
    if (particles.length >= MAX_PARTICLES) return;
    const angle = opts.angle ?? Math.random() * Math.PI * 2;
    const speed = opts.speed ?? (20 + Math.random() * 60);
    particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: opts.life ?? (0.3 + Math.random() * 0.5),
        maxLife: opts.life ?? (0.3 + Math.random() * 0.5),
        size: opts.size ?? (1 + Math.random() * 3),
        color: opts.color ?? '#ffcc44',
        gravity: opts.gravity ?? 0,
        friction: opts.friction ?? 0.98,
    });
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        p.vx *= p.friction;
        p.vy *= p.friction;
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
    }
}

function renderParticles() {
    for (const p of particles) {
        const a = p.life / p.maxLife;
        const s = p.size * a;
        ctx.globalAlpha = a * 0.8;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ── Sound System ──
function playSound(type) {
    try {
        const ac = getAudio();
        const now = ac.currentTime;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain);
        gain.connect(ac.destination);

        switch (type) {
            case 'chime': // Ship guided
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
                osc.frequency.exponentialRampToValueAtTime(1100, now + 0.15);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
                break;

            case 'arrive': // Ship safe in harbor
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(660, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
                break;

            case 'repel': // Creature hit
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
                break;

            case 'sink': // Ship lost
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.8);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.start(now); osc.stop(now + 0.8);
                break;

            case 'horn': // Merchant horn
                osc.type = 'sine';
                osc.frequency.setValueAtTime(110, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.setValueAtTime(0.06, now + 0.4);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.start(now); osc.stop(now + 0.8);
                break;

            case 'bell': // Skiff bell
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
                break;

            case 'whistle': // Passenger vessel
                osc.type = 'sine';
                osc.frequency.setValueAtTime(550, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.15);
                osc.frequency.exponentialRampToValueAtTime(550, now + 0.4);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
                break;

            case 'abyssal': // Deep sub-bass rumble
                osc.type = 'sine';
                osc.frequency.setValueAtTime(35, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
                osc.start(now); osc.stop(now + 1.5);
                break;

            case 'shade': // Whisper-like hiss
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(3000, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
                gain.gain.setValueAtTime(0.03, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
                break;

            case 'flinch': // Quick wet dart
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.06);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
                break;

            case 'shadeHit': // Shade reaches lighthouse
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
                osc.start(now); osc.stop(now + 1.0);
                break;

            case 'overdrive':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.04, now + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
                break;

            case 'dawn':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(330, now);
                gain.gain.setValueAtTime(0.0, now);
                gain.gain.linearRampToValueAtTime(0.06, now + 0.5);
                gain.gain.linearRampToValueAtTime(0.0, now + 2.0);
                osc.start(now); osc.stop(now + 2.0);
                // Add a second note
                const osc2 = ac.createOscillator();
                const gain2 = ac.createGain();
                osc2.connect(gain2); gain2.connect(ac.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(440, now + 0.5);
                gain2.gain.setValueAtTime(0.0, now + 0.5);
                gain2.gain.linearRampToValueAtTime(0.05, now + 1.0);
                gain2.gain.linearRampToValueAtTime(0.0, now + 2.5);
                osc2.start(now + 0.5); osc2.stop(now + 2.5);
                break;
        }
    } catch(e) {}
}

// Ambient water sound (looping noise)
let ambientNode = null;
function startAmbient() {
    try {
        const ac = getAudio();
        if (ambientNode) return;
        const bufSize = ac.sampleRate * 2;
        const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
        const data = buf.getChannelData(0);
        // Brown noise (low rumble)
        let last = 0;
        for (let i = 0; i < bufSize; i++) {
            const white = Math.random() * 2 - 1;
            last = (last + (0.02 * white)) / 1.02;
            data[i] = last * 3.5;
        }
        const source = ac.createBufferSource();
        source.buffer = buf;
        source.loop = true;
        const gain = ac.createGain();
        gain.gain.value = 0.04;
        const filter = ac.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 300;
        source.connect(filter);
        filter.connect(gain);
        gain.connect(ac.destination);
        source.start();
        ambientNode = { source, gain };
    } catch(e) {}
}

// ── Lighthouse ──
const lighthouse = {
    x: 0, y: 0, // set on resize
    width: 28,
    height: 90,
    // Light source position (top of lantern room)
    get lightX() { return this.x; },
    get lightY() { return this.y - this.height - 5; },
};

// ── Beam ──
const beam = {
    angle: -Math.PI / 2, // pointing up
    angularVel: 0,
    fuel: CFG.beam.fuelMax,
    overdrive: false,
    overdriveActive: false,
    overdriveFlash: 0,

    update(dt) {
        // Target angle from mouse (relative to light source at top of lighthouse)
        const dx = input.mx - lighthouse.lightX;
        const dy = input.my - lighthouse.lightY;
        let targetAngle = Math.atan2(dy, dx);

        // Clamp to upper semicircle (-PI to 0, roughly)
        if (targetAngle > 0.15) targetAngle = 0.15;
        if (targetAngle < -Math.PI - 0.15) targetAngle = -Math.PI - 0.15;

        // Angular difference
        let diff = targetAngle - this.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        // Accelerate toward target with damping
        this.angularVel += diff * CFG.beam.angularAccel * dt;
        this.angularVel *= CFG.beam.angularDamping;
        this.angularVel = Math.max(-CFG.beam.maxAngularVel, Math.min(CFG.beam.maxAngularVel, this.angularVel));
        this.angle += this.angularVel * dt;

        // Fuel
        this.overdriveActive = input.overdrive && this.fuel > 5;
        if (this.overdriveActive) {
            this.fuel -= CFG.beam.overdriveDrain * dt;
            this.overdriveFlash = 0.3;
        } else {
            this.fuel -= CFG.beam.fuelDrain * dt;
        }
        this.fuel = Math.max(0, Math.min(CFG.beam.fuelMax, this.fuel));
        this.fuel += CFG.beam.fuelRegen * dt;
        this.fuel = Math.min(CFG.beam.fuelMax, this.fuel);

        if (this.overdriveFlash > 0) this.overdriveFlash -= dt;

        // Beam particles (light scatter)
        if (Math.random() < 0.3) {
            const dist = 60 + Math.random() * this.getLength() * 0.6;
            const spread = (Math.random() - 0.5) * this.getConeAngle() * 0.5;
            const px = lighthouse.lightX + Math.cos(this.angle + spread) * dist;
            const py = lighthouse.lightY + Math.sin(this.angle + spread) * dist;
            spawnParticle(px, py, {
                speed: 5 + Math.random() * 10,
                angle: Math.random() * Math.PI * 2,
                life: 0.3 + Math.random() * 0.4,
                size: 0.5 + Math.random() * 1.5,
                color: this.fuelRatio > 0.5 ? '#fff8e0' : '#ccaa66',
                gravity: 5,
            });
        }
    },

    get fuelRatio() { return this.fuel / CFG.beam.fuelMax; },

    // Effective power accounting for shade damage
    get effectivePower() {
        return lighthouseDamage > 0 ? (1 - lighthouseDamage) : 1;
    },

    getConeAngle() {
        const base = CFG.beam.coneAngle * (0.7 + this.fuelRatio * 0.3) * this.effectivePower;
        return this.overdriveActive ? base * CFG.beam.overdriveMultiplier : base;
    },

    getLength() {
        let base = H * CFG.beam.coneLength * (0.6 + this.fuelRatio * 0.4) * this.effectivePower;
        // Fog event reduces beam range
        if (activeEvent === 'fog') base *= 0.6;
        // New Moon reduces far range
        if (activeEvent === 'newMoon') base *= 0.7;
        return this.overdriveActive ? base * 1.3 : base;
    },

    isPointIlluminated(px, py) {
        // Fog horn reveals everything temporarily
        if (fogHornActive > 0) {
            const dx = px - lighthouse.lightX;
            const dy = py - lighthouse.lightY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < Math.max(W, H) * 0.8) return 0.4; // moderate reveal
        }

        const dx = px - lighthouse.lightX;
        const dy = py - lighthouse.lightY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        let len = this.getLength();

        // Spyglass extends range in narrow cone
        if (spyglassActive > 0) len *= 1.5;

        if (dist > len) return 0;

        let angleToPoint = Math.atan2(dy, dx);
        let diff = angleToPoint - this.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        let cone = this.getConeAngle();
        // Spyglass narrows cone
        if (spyglassActive > 0) cone *= 0.3;

        if (Math.abs(diff) > cone) return 0;

        const angleFactor = 1 - Math.abs(diff) / cone;
        const distFactor = 1 - (dist / len);
        return angleFactor * distFactor * this.fuelRatio;
    },

    render() {
        const len = this.getLength();
        const cone = this.getConeAngle();
        const fr = this.fuelRatio;

        // Flicker at low fuel
        let flickerAlpha = 1;
        if (fr < 0.25) {
            flickerAlpha = 0.5 + Math.random() * 0.5;
        } else if (fr < 0.5) {
            flickerAlpha = 0.8 + Math.sin(time * 12) * 0.1;
        }

        ctx.save();
        ctx.translate(lighthouse.lightX, lighthouse.lightY);

        // The cone
        const a1 = this.angle - cone;
        const a2 = this.angle + cone;

        // Volumetric layers
        for (let layer = 3; layer >= 0; layer--) {
            const layerCone = cone * (1 + layer * 0.08);
            const layerLen = len * (1 - layer * 0.05);
            const alpha = (0.04 + layer * 0.02) * flickerAlpha * (0.5 + fr * 0.5);

            const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, layerLen);
            const beamColor = fr > 0.5 ? CFG.colors.beam : CFG.colors.beamDim;
            grad.addColorStop(0, `rgba(255,204,68,${alpha * 2})`);
            grad.addColorStop(0.4, `rgba(255,240,200,${alpha})`);
            grad.addColorStop(1, `rgba(255,240,200,0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, layerLen, this.angle - layerCone, this.angle + layerCone);
            ctx.closePath();
            ctx.fill();
        }

        // Bright center line
        ctx.strokeStyle = `rgba(255,248,224,${0.15 * flickerAlpha * fr})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(this.angle) * len * 0.9, Math.sin(this.angle) * len * 0.9);
        ctx.stroke();

        // Water caustic ellipse at beam end
        const endX = Math.cos(this.angle) * len * 0.7;
        const endY = Math.sin(this.angle) * len * 0.7;
        ctx.fillStyle = `rgba(255,220,120,${0.03 * flickerAlpha * fr})`;
        ctx.beginPath();
        ctx.ellipse(endX, endY, 40 + cone * 100, 15, this.angle, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Overdrive flash
        if (this.overdriveFlash > 0) {
            ctx.fillStyle = `rgba(255,248,224,${this.overdriveFlash * 0.1})`;
            ctx.fillRect(0, 0, W, H);
        }
    },
};

// ── Ships ──
let ships = [];

function spawnShip(type) {
    // Spawn from edges, heading roughly toward harbor
    const side = Math.random() < 0.5 ? -1 : 1;
    const edge = Math.random();
    let x, y, targetAngle;

    if (edge < 0.6) {
        // From sides
        x = side > 0 ? W + 20 : -20;
        y = H * (0.1 + Math.random() * 0.4);
        targetAngle = side > 0 ? Math.PI + (Math.random() - 0.5) * 0.6 : (Math.random() - 0.5) * 0.6;
    } else {
        // From top
        x = W * (0.15 + Math.random() * 0.7);
        y = -20;
        targetAngle = Math.PI / 2 + (Math.random() - 0.5) * 0.5;
    }

    const speeds = { skiff: CFG.ships.skiffSpeed, merchant: CFG.ships.merchantSpeed,
                     passenger: CFG.ships.passengerSpeed, ghostShip: CFG.ships.ghostShipSpeed };
    const sizes = { skiff: 10, merchant: 18, passenger: 20, ghostShip: 16 };

    const ship = {
        type, // 'skiff', 'merchant', 'passenger', 'ghostShip'
        x, y,
        angle: targetAngle,
        speed: speeds[type] || CFG.ships.merchantSpeed,
        guided: false,
        guidedTimer: 0,
        driftTimer: 0,
        progress: 0,
        health: 1.0,
        lanternBright: type === 'ghostShip' ? 0.15 : 1.0,
        hornTimer: type === 'skiff' ? 3 + Math.random() * 4 : 5 + Math.random() * 5,
        sinking: false,
        sinkTimer: 0,
        alive: true,
        saved: false,
        bobPhase: Math.random() * Math.PI * 2,
        size: sizes[type] || 14,
        revealed: type !== 'ghostShip', // ghost ships start unrevealed
        revealProgress: type === 'ghostShip' ? 0 : 1,
    };

    // Heavy ships have a target point (harbor)
    if (type !== 'skiff') {
        ship.targetX = lighthouse.x + (Math.random() - 0.5) * 80;
        ship.targetY = lighthouse.y + 10;
    }

    ships.push(ship);
}

function updateShips(dt) {
    for (const s of ships) {
        if (s.sinking) {
            s.sinkTimer += dt;
            s.y += 3 * dt;
            s.lanternBright *= 0.97;
            if (s.sinkTimer > 3) s.alive = false;
            continue;
        }

        const illumination = beam.isPointIlluminated(s.x, s.y);
        s.bobPhase += dt * 2;

        // Ghost ship reveal logic: looks normal at range, revealed empty up close
        if (s.type === 'ghostShip') {
            const distToLighthouse = Math.sqrt((s.x - lighthouse.x) ** 2 + (s.y - lighthouse.y) ** 2);
            const revealThreshold = beam.getLength() * CFG.ships.ghostShipRevealDist;
            if (illumination > 0.3 && distToLighthouse < revealThreshold) {
                s.revealProgress = Math.min(1, s.revealProgress + dt * 1.5);
                if (s.revealProgress > 0.5 && !s.revealed) {
                    s.revealed = true;
                    playSound('repel'); // unsettling reveal sound
                }
            }
            // Ghost ships drift aimlessly, never reach harbor
            s.angle += Math.sin(time * 0.3 + s.bobPhase) * 0.15 * dt;
            s.x += Math.cos(s.angle) * s.speed * dt;
            s.y += Math.sin(s.angle) * s.speed * dt;
            // Ghost ship lantern flickers eerily
            s.lanternBright = 0.05 + Math.sin(time * 4 + s.bobPhase) * 0.05;
            if (s.x < -80 || s.x > W + 80 || s.y > H + 80 || s.y < -80) s.alive = false;
            continue;
        }

        // Normal ship logic
        const isHeavy = s.type === 'merchant' || s.type === 'passenger';

        if (illumination > 0.1) {
            s.guided = true;
            s.guidedTimer += dt;
            s.driftTimer = 0;
            s.lanternBright = Math.min(1, s.lanternBright + dt * 2);

            if (isHeavy) {
                s.progress += CFG.ships.merchantGuideRate * dt * illumination * 3;
                const dx = s.targetX - s.x;
                const dy = s.targetY - s.y;
                const targetA = Math.atan2(dy, dx);
                let aDiff = targetA - s.angle;
                while (aDiff > Math.PI) aDiff -= Math.PI * 2;
                while (aDiff < -Math.PI) aDiff += Math.PI * 2;
                s.angle += aDiff * 0.5 * dt;
            } else {
                // Skiff: brief flash orients, then sails toward harbor
                if (s.guidedTimer > CFG.ships.skiffFlashNeed) {
                    const dx = lighthouse.x - s.x;
                    const dy = lighthouse.y + 20 - s.y;
                    const targetA = Math.atan2(dy, dx);
                    let aDiff = targetA - s.angle;
                    while (aDiff > Math.PI) aDiff -= Math.PI * 2;
                    while (aDiff < -Math.PI) aDiff += Math.PI * 2;
                    s.angle += aDiff * 1.5 * dt;
                }
            }

            // Chime on first contact
            if (s.guidedTimer < dt * 2 && s.guidedTimer > 0) {
                playSound('chime');
            }
        } else {
            s.driftTimer += dt;
            if (isHeavy) {
                s.progress += CFG.ships.merchantDriftRate * dt;
                s.progress = Math.max(0, s.progress);
                s.angle += (Math.random() - 0.5) * 0.3 * dt;
            } else {
                if (s.driftTimer > CFG.ships.skiffDriftTime) {
                    s.guidedTimer = 0;
                    s.angle += (Math.random() - 0.5) * 0.4 * dt;
                }
            }
            s.lanternBright = Math.max(0.2, s.lanternBright - dt * 0.5);
        }

        // Storm event pushes ships off course
        if (activeEvent === 'storm') {
            if (Math.random() < 0.02) {
                s.angle += (Math.random() - 0.5) * 0.8;
            }
        }

        // Move
        s.x += Math.cos(s.angle) * s.speed * dt;
        s.y += Math.sin(s.angle) * s.speed * dt;

        // Horn/bell timer
        s.hornTimer -= dt;
        if (s.hornTimer <= 0) {
            if (s.type === 'skiff') {
                s.hornTimer = 4 + Math.random() * 3;
                playSound('bell');
            } else if (s.type === 'passenger') {
                s.hornTimer = 5 + Math.random() * 4;
                playSound('whistle');
            } else {
                s.hornTimer = 6 + Math.random() * 4;
                playSound('horn');
            }
        }

        // Check if reached harbor
        const distToHarbor = Math.sqrt((s.x - lighthouse.x) ** 2 + (s.y - lighthouse.y) ** 2);
        if (distToHarbor < 50 && s.y > lighthouse.y - 30) {
            s.saved = true;
            s.alive = false;
            nightStats.saved++;
            if (s.type === 'merchant') nightStats.merchantsSaved++;
            if (s.type === 'passenger') nightStats.passengersSaved++;
            harborGlow += 0.15;
            playSound('arrive');
            for (let i = 0; i < 8; i++) {
                spawnParticle(s.x, s.y, {
                    speed: 20 + Math.random() * 40,
                    color: '#ffcc44',
                    life: 0.5 + Math.random() * 0.5,
                    gravity: -10,
                });
            }
        }

        // Out of bounds = lost
        if (s.x < -60 || s.x > W + 60 || s.y > H + 60) {
            if (!s.saved) {
                s.alive = false;
                nightStats.lost++;
                if (s.type === 'passenger') nightStats.passengersLost++;
                playSound('sink');
            }
        }

        // Damage from creatures
        if (s.health <= 0 && !s.sinking) {
            s.sinking = true;
            s.speed = 0;
            nightStats.lost++;
            if (s.type === 'passenger') nightStats.passengersLost++;
            playSound('sink');
        }
    }

    ships = ships.filter(s => s.alive);
}

function renderShips() {
    for (const s of ships) {
        const ill = beam.isPointIlluminated(s.x, s.y);
        const vis = Math.max(0.05, ill * 0.8 + 0.2 * s.lanternBright);
        const bob = Math.sin(s.bobPhase) * 2;

        ctx.save();
        ctx.translate(s.x, s.y + bob);
        ctx.rotate(s.angle + Math.sin(s.bobPhase * 0.7) * 0.05);
        ctx.globalAlpha = s.sinking ? Math.max(0, 1 - s.sinkTimer / 3) : 1;

        if (s.type === 'ghostShip') {
            // Ghost ship: looks like a merchant at range, but eerie up close
            const ghostAlpha = vis * (s.revealed ? 0.5 : 0.9);
            ctx.fillStyle = `rgba(${s.revealed ? '50,50,60' : '80,70,55'},${ghostAlpha})`;
            ctx.beginPath();
            ctx.moveTo(-s.size, 0);
            ctx.lineTo(-s.size * 0.8, s.size * 0.5);
            ctx.lineTo(s.size * 0.8, s.size * 0.5);
            ctx.lineTo(s.size, 0);
            ctx.lineTo(s.size * 0.7, -s.size * 0.3);
            ctx.lineTo(-s.size * 0.7, -s.size * 0.3);
            ctx.closePath();
            ctx.fill();
            // Broken mast
            ctx.strokeStyle = `rgba(70,65,55,${ghostAlpha})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -s.size * 0.3);
            ctx.lineTo(s.revealed ? 3 : 0, -s.size * (s.revealed ? 0.7 : 1.2));
            ctx.stroke();
            // Tattered sail if revealed
            if (s.revealed && ill > 0.3) {
                ctx.fillStyle = `rgba(90,85,75,${vis * 0.3})`;
                ctx.beginPath();
                ctx.moveTo(2, -s.size * 0.65);
                ctx.lineTo(s.size * 0.4, -s.size * 0.4);
                ctx.lineTo(1, -s.size * 0.35);
                ctx.closePath();
                ctx.fill();
            }
        } else if (s.type === 'merchant' || s.type === 'passenger') {
            // Hull - passengers have a slightly warmer tone
            const hullColor = s.type === 'passenger' ? `rgba(85,65,50,${vis})` : `rgba(80,70,55,${vis})`;
            ctx.fillStyle = hullColor;
            ctx.beginPath();
            ctx.moveTo(-s.size, 0);
            ctx.lineTo(-s.size * 0.8, s.size * 0.5);
            ctx.lineTo(s.size * 0.8, s.size * 0.5);
            ctx.lineTo(s.size, 0);
            ctx.lineTo(s.size * 0.7, -s.size * 0.3);
            ctx.lineTo(-s.size * 0.7, -s.size * 0.3);
            ctx.closePath();
            ctx.fill();
            // Mast
            ctx.strokeStyle = `rgba(100,90,70,${vis})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -s.size * 0.3);
            ctx.lineTo(0, -s.size * 1.2);
            ctx.stroke();
            // Sail
            ctx.fillStyle = `rgba(180,170,150,${vis * 0.6})`;
            ctx.beginPath();
            ctx.moveTo(0, -s.size * 1.1);
            ctx.lineTo(s.size * 0.6, -s.size * 0.5);
            ctx.lineTo(0, -s.size * 0.4);
            ctx.closePath();
            ctx.fill();
            // Passenger vessel: extra cabin/portholes visible up close
            if (s.type === 'passenger' && ill > 0.3) {
                ctx.fillStyle = `rgba(255,200,100,${vis * 0.3})`;
                for (let p = -2; p <= 2; p++) {
                    ctx.beginPath();
                    ctx.arc(p * s.size * 0.2, -s.size * 0.1, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        } else {
            // Skiff: small boat
            ctx.fillStyle = `rgba(90,80,60,${vis})`;
            ctx.beginPath();
            ctx.ellipse(0, 0, s.size, s.size * 0.4, 0, 0, Math.PI);
            ctx.fill();
            ctx.fillStyle = `rgba(70,60,45,${vis})`;
            ctx.fillRect(-1, -s.size * 0.5, 2, s.size * 0.4);
        }

        // Lantern (ghost ships have dim/eerie lantern)
        const lanternGlow = s.lanternBright * (0.8 + Math.sin(time * 3 + s.bobPhase) * 0.2);
        const lanternColor = s.type === 'ghostShip' && s.revealed
            ? `rgba(100,150,180,${lanternGlow * vis * 0.5})`
            : `rgba(255,170,50,${lanternGlow * vis})`;
        const isHeavy = s.type !== 'skiff';
        ctx.fillStyle = lanternColor;
        ctx.beginPath();
        ctx.arc(0, -s.size * (isHeavy ? 0.3 : 0.5), 2 + lanternGlow, 0, Math.PI * 2);
        ctx.fill();
        // Lantern glow halo
        ctx.fillStyle = s.type === 'ghostShip' && s.revealed
            ? `rgba(100,150,180,${lanternGlow * vis * 0.05})`
            : `rgba(255,170,50,${lanternGlow * vis * 0.15})`;
        ctx.beginPath();
        ctx.arc(0, -s.size * (isHeavy ? 0.3 : 0.5), 8 + lanternGlow * 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Distress indicator (when drifting too long, for heavy ships)
        if (s.driftTimer > 3 && !s.sinking && (s.type === 'merchant' || s.type === 'passenger')) {
            const blink = Math.sin(time * 8) > 0;
            if (blink) {
                ctx.fillStyle = s.type === 'passenger' ? 'rgba(255,120,60,0.7)' : 'rgba(255,80,80,0.6)';
                ctx.beginPath();
                ctx.arc(s.x, s.y - 25 + bob, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
}

// ── Creatures ──
let creatures = [];

function spawnCreature(type) {
    const angle = -Math.PI * (0.1 + Math.random() * 0.8);
    const dist = Math.max(W, H) * 0.6 + Math.random() * 200;
    const x = lighthouse.x + Math.cos(angle) * dist;
    const y = lighthouse.y + Math.sin(angle) * dist;

    const sizes = { lurker: 12 + Math.random() * 6, flinch: 8 + Math.random() * 4,
                    mimic: 10, abyssal: CFG.creatures.abyssalSize, shade: 10 + Math.random() * 4 };
    const speeds = { lurker: CFG.creatures.lurkerSpeed, flinch: CFG.creatures.flinchSpeed,
                     mimic: CFG.creatures.mimicSpeed, abyssal: CFG.creatures.abyssalSpeed,
                     shade: CFG.creatures.shadeSpeed };

    creatures.push({
        type,
        x, y,
        vx: 0, vy: 0,
        speed: speeds[type] || 30,
        fleeing: false,
        fleeTimer: 0,
        alive: true,
        phase: Math.random() * Math.PI * 2,
        size: sizes[type] || 12,
        targetShip: null,
        // Flinch-specific
        frozen: false,
        frozenTimer: 0,
        bolting: false,
        boltTimer: 0,
        boltAngle: 0,
        // Mimic-specific
        disguised: type === 'mimic', // looks like a skiff until close
        mimicRevealed: false,
        // Abyssal-specific
        abyssalSoundTimer: type === 'abyssal' ? 3 : 0,
        // Shade-specific
        reachedLighthouse: false,
    });
}

function updateCreatures(dt) {
    const aggressionMult = activeEvent === 'redTide' ? 1.5 : 1.0;

    for (const c of creatures) {
        c.phase += dt * 3;
        const ill = beam.isPointIlluminated(c.x, c.y);
        const distToLighthouse = Math.sqrt((c.x - lighthouse.x) ** 2 + (c.y - lighthouse.y) ** 2);

        // ── SHADE: targets lighthouse, ignores ships ──
        if (c.type === 'shade') {
            if (ill > 0.2 && !c.fleeing) {
                c.fleeing = true;
                c.fleeTimer = 1.5;
                const awayAngle = Math.atan2(c.y - lighthouse.y, c.x - lighthouse.x);
                c.vx = Math.cos(awayAngle) * 60;
                c.vy = Math.sin(awayAngle) * 60;
                playSound('repel');
                for (let i = 0; i < 4; i++) {
                    spawnParticle(c.x, c.y, {
                        speed: 20 + Math.random() * 30,
                        angle: awayAngle + (Math.random() - 0.5) * 1,
                        color: '#6633aa',
                        life: 0.4, size: 2,
                    });
                }
            }
            if (c.fleeing) {
                c.fleeTimer -= dt;
                c.x += c.vx * dt; c.y += c.vy * dt;
                c.vx *= 0.96; c.vy *= 0.96;
                if (c.fleeTimer <= 0) c.fleeing = false;
            } else {
                // Move toward lighthouse base
                const dx = lighthouse.x - c.x;
                const dy = lighthouse.y - c.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    c.x += (dx / dist) * c.speed * aggressionMult * dt;
                    c.y += (dy / dist) * c.speed * aggressionMult * dt;
                }
                // Shade undulation - more ghostly
                c.x += Math.sin(c.phase * 1.3) * 12 * dt;
                c.y += Math.cos(c.phase * 0.9) * 8 * dt;
            }
            // Reached lighthouse!
            if (distToLighthouse < 40 && !c.reachedLighthouse) {
                c.reachedLighthouse = true;
                lighthouseDamage = 0.4; // beam weakens
                lighthouseDamageTimer = CFG.creatures.shadeDamageTime;
                c.alive = false;
                playSound('shadeHit');
                for (let i = 0; i < 10; i++) {
                    spawnParticle(lighthouse.x, lighthouse.y, {
                        speed: 15 + Math.random() * 30,
                        color: '#442266', life: 0.6, size: 3,
                    });
                }
            }
            if (c.x < -200 || c.x > W + 200 || c.y < -200 || c.y > H + 200) c.alive = false;
            continue;
        }

        // ── ABYSSAL: huge, only overdrive repels ──
        if (c.type === 'abyssal') {
            c.abyssalSoundTimer -= dt;
            if (c.abyssalSoundTimer <= 0) {
                c.abyssalSoundTimer = 5 + Math.random() * 4;
                playSound('abyssal');
            }
            // Normal beam does NOT repel abyssals
            if (beam.overdriveActive && ill > 0.3 && !c.fleeing) {
                c.fleeing = true;
                c.fleeTimer = 3.0;
                const awayAngle = Math.atan2(c.y - lighthouse.y, c.x - lighthouse.x);
                c.vx = Math.cos(awayAngle) * CFG.creatures.abyssalPushback;
                c.vy = Math.sin(awayAngle) * CFG.creatures.abyssalPushback;
                playSound('overdrive');
                nightStats.creaturesRepelled++;
                for (let i = 0; i < 8; i++) {
                    spawnParticle(c.x, c.y, {
                        speed: 40 + Math.random() * 50,
                        angle: awayAngle + (Math.random() - 0.5) * 0.8,
                        color: '#aa66dd', life: 0.5, size: 3,
                    });
                }
            }
            if (c.fleeing) {
                c.fleeTimer -= dt;
                c.x += c.vx * dt; c.y += c.vy * dt;
                c.vx *= 0.97; c.vy *= 0.97;
                if (c.fleeTimer <= 0) c.fleeing = false;
            } else {
                // Move toward nearest ship or lighthouse
                let tx = lighthouse.x, ty = lighthouse.y;
                let nearestDist = Infinity;
                for (const s of ships) {
                    if (s.sinking || s.type === 'ghostShip') continue;
                    const d = Math.sqrt((c.x - s.x) ** 2 + (c.y - s.y) ** 2);
                    if (d < nearestDist) { nearestDist = d; tx = s.x; ty = s.y; }
                }
                const dx = tx - c.x, dy = ty - c.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    c.x += (dx / dist) * c.speed * aggressionMult * dt;
                    c.y += (dy / dist) * c.speed * aggressionMult * dt;
                }
                // Heavy undulation
                c.x += Math.sin(c.phase * 0.5) * 15 * dt;
                c.y += Math.cos(c.phase * 0.3) * 10 * dt;
            }
            // Damage ships on contact
            for (const s of ships) {
                if (s.sinking || s.type === 'ghostShip') continue;
                const d = Math.sqrt((c.x - s.x) ** 2 + (c.y - s.y) ** 2);
                if (d < c.size + s.size) {
                    s.health -= dt * 1.0; // abyssals hit harder
                    s.angle += (Math.random() - 0.5) * 3 * dt;
                }
            }
            if (c.x < -300 || c.x > W + 300 || c.y < -300 || c.y > H + 300) c.alive = false;
            continue;
        }

        // ── FLINCH: freezes when illuminated, bolts when beam leaves ──
        if (c.type === 'flinch') {
            if (c.bolting) {
                c.boltTimer -= dt;
                c.x += Math.cos(c.boltAngle) * CFG.creatures.flinchBoltSpeed * dt;
                c.y += Math.sin(c.boltAngle) * CFG.creatures.flinchBoltSpeed * dt;
                if (c.boltTimer <= 0) c.bolting = false;
            } else if (c.frozen) {
                // Frozen in beam - don't move
                if (ill < 0.1) {
                    // Beam left! Bolt toward nearest ship
                    c.frozen = false;
                    c.bolting = true;
                    c.boltTimer = CFG.creatures.flinchBoltDuration;
                    let tx = lighthouse.x, ty = lighthouse.y;
                    for (const s of ships) {
                        if (s.sinking || s.type === 'ghostShip') continue;
                        const d = Math.sqrt((c.x - s.x) ** 2 + (c.y - s.y) ** 2);
                        const d2 = Math.sqrt((tx - c.x) ** 2 + (ty - c.y) ** 2);
                        if (d < d2) { tx = s.x; ty = s.y; }
                    }
                    c.boltAngle = Math.atan2(ty - c.y, tx - c.x);
                    playSound('flinch');
                }
                c.frozenTimer -= dt;
                if (c.frozenTimer <= 0) {
                    c.frozen = false;
                    c.bolting = true;
                    c.boltTimer = CFG.creatures.flinchBoltDuration;
                    c.boltAngle = Math.atan2(lighthouse.y - c.y, lighthouse.x - c.x);
                }
            } else {
                // Darting toward ships
                if (ill > 0.2) {
                    c.frozen = true;
                    c.frozenTimer = CFG.creatures.flinchFreezeTime;
                    playSound('repel');
                    nightStats.creaturesRepelled++;
                } else {
                    // Move erratically toward ships
                    let nearestDist = Infinity;
                    c.targetShip = null;
                    for (const s of ships) {
                        if (s.sinking || s.type === 'ghostShip') continue;
                        const d = Math.sqrt((c.x - s.x) ** 2 + (c.y - s.y) ** 2);
                        if (d < nearestDist) { nearestDist = d; c.targetShip = s; }
                    }
                    if (c.targetShip) {
                        const dx = c.targetShip.x - c.x, dy = c.targetShip.y - c.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > 0) {
                            c.x += (dx / dist) * c.speed * aggressionMult * dt;
                            c.y += (dy / dist) * c.speed * aggressionMult * dt;
                        }
                        if (nearestDist < c.size + c.targetShip.size) {
                            c.targetShip.health -= dt * 0.4;
                            c.targetShip.angle += (Math.random() - 0.5) * 2 * dt;
                        }
                    }
                    // Erratic movement
                    c.x += Math.sin(c.phase * 2) * 20 * dt;
                    c.y += Math.cos(c.phase * 1.5) * 15 * dt;
                }
            }
            if (c.x < -200 || c.x > W + 200 || c.y < -200 || c.y > H + 200) c.alive = false;
            continue;
        }

        // ── MIMIC: disguised as skiff until close illumination ──
        if (c.type === 'mimic') {
            if (ill > 0.3 && distToLighthouse < beam.getLength() * CFG.creatures.mimicRevealDist && c.disguised) {
                c.disguised = false;
                c.mimicRevealed = true;
                playSound('repel');
                for (let i = 0; i < 6; i++) {
                    spawnParticle(c.x, c.y, {
                        speed: 25 + Math.random() * 35,
                        color: '#8844aa', life: 0.4, size: 2,
                    });
                }
            }
            if (c.disguised) {
                // Move like a skiff (toward harbor area but not directly)
                const dx = lighthouse.x + (Math.sin(c.phase * 0.2) * 100) - c.x;
                const dy = lighthouse.y - 50 - c.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    c.x += (dx / dist) * c.speed * 0.7 * dt;
                    c.y += (dy / dist) * c.speed * 0.7 * dt;
                }
                c.x += Math.sin(c.phase) * 5 * dt;
            } else {
                // Revealed: behaves like a lurker
                if (ill > 0.2 && !c.fleeing) {
                    c.fleeing = true;
                    c.fleeTimer = CFG.creatures.lurkerFleeDuration;
                    const awayAngle = Math.atan2(c.y - lighthouse.y, c.x - lighthouse.x);
                    c.vx = Math.cos(awayAngle) * CFG.creatures.lurkerFleeSpeed;
                    c.vy = Math.sin(awayAngle) * CFG.creatures.lurkerFleeSpeed;
                    nightStats.creaturesRepelled++;
                }
                if (c.fleeing) {
                    c.fleeTimer -= dt;
                    c.x += c.vx * dt; c.y += c.vy * dt;
                    c.vx *= 0.97; c.vy *= 0.97;
                    if (c.fleeTimer <= 0) c.fleeing = false;
                } else {
                    let nearestDist = Infinity;
                    for (const s of ships) {
                        if (s.sinking || s.type === 'ghostShip') continue;
                        const d = Math.sqrt((c.x - s.x) ** 2 + (c.y - s.y) ** 2);
                        if (d < nearestDist) { nearestDist = d; c.targetShip = s; }
                    }
                    if (c.targetShip) {
                        const dx = c.targetShip.x - c.x, dy = c.targetShip.y - c.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > 0) {
                            c.x += (dx / dist) * c.speed * aggressionMult * dt;
                            c.y += (dy / dist) * c.speed * aggressionMult * dt;
                        }
                        if (nearestDist < c.size + c.targetShip.size) {
                            c.targetShip.health -= dt * 0.4;
                        }
                    }
                    c.x += Math.sin(c.phase) * 8 * dt;
                    c.y += Math.cos(c.phase * 0.7) * 5 * dt;
                }
            }
            if (c.x < -200 || c.x > W + 200 || c.y < -200 || c.y > H + 200) c.alive = false;
            continue;
        }

        // ── LURKER: standard behavior ──
        if (ill > 0.2 && !c.fleeing) {
            c.fleeing = true;
            c.fleeTimer = CFG.creatures.lurkerFleeDuration;
            const awayAngle = Math.atan2(c.y - lighthouse.y, c.x - lighthouse.x);
            c.vx = Math.cos(awayAngle) * CFG.creatures.lurkerFleeSpeed;
            c.vy = Math.sin(awayAngle) * CFG.creatures.lurkerFleeSpeed;
            playSound('repel');
            nightStats.creaturesRepelled++;
            for (let i = 0; i < 5; i++) {
                spawnParticle(c.x, c.y, {
                    speed: 30 + Math.random() * 40,
                    angle: awayAngle + (Math.random() - 0.5) * 1,
                    color: '#8844aa', life: 0.3, size: 2,
                });
            }
        }

        if (c.fleeing) {
            c.fleeTimer -= dt;
            c.x += c.vx * dt; c.y += c.vy * dt;
            c.vx *= 0.97; c.vy *= 0.97;
            if (c.fleeTimer <= 0) c.fleeing = false;
        } else {
            // Attracted to ghost ships
            let targetX = null, targetY = null;
            let nearestDist = Infinity;

            // Check for ghost ships first (lure effect)
            for (const s of ships) {
                if (s.type === 'ghostShip') {
                    const d = Math.sqrt((c.x - s.x) ** 2 + (c.y - s.y) ** 2);
                    if (d < CFG.ships.ghostShipLureRadius && d < nearestDist) {
                        nearestDist = d; targetX = s.x; targetY = s.y;
                    }
                }
            }

            // Otherwise find nearest ship
            if (!targetX) {
                for (const s of ships) {
                    if (s.sinking || s.type === 'ghostShip') continue;
                    const d = Math.sqrt((c.x - s.x) ** 2 + (c.y - s.y) ** 2);
                    if (d < nearestDist) { nearestDist = d; targetX = s.x; targetY = s.y; c.targetShip = s; }
                }
            }

            if (targetX !== null) {
                const dx = targetX - c.x, dy = targetY - c.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    c.x += (dx / dist) * c.speed * aggressionMult * dt;
                    c.y += (dy / dist) * c.speed * aggressionMult * dt;
                }
                // Damage on contact with actual ships
                if (c.targetShip && nearestDist < c.size + c.targetShip.size) {
                    c.targetShip.health -= dt * 0.5;
                    c.targetShip.angle += (Math.random() - 0.5) * 2 * dt;
                }
            } else {
                const dx = lighthouse.x - c.x, dy = lighthouse.y - c.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    c.x += (dx / dist) * c.speed * 0.5 * dt;
                    c.y += (dy / dist) * c.speed * 0.5 * dt;
                }
            }
            c.x += Math.sin(c.phase) * 8 * dt;
            c.y += Math.cos(c.phase * 0.7) * 5 * dt;
        }

        if (c.x < -200 || c.x > W + 200 || c.y < -200 || c.y > H + 200) c.alive = false;
    }

    creatures = creatures.filter(c => c.alive);
}

function renderCreatures() {
    for (const c of creatures) {
        const ill = beam.isPointIlluminated(c.x, c.y);
        const undulate = Math.sin(c.phase) * 3;

        // ── MIMIC (disguised): render as fake skiff ──
        if (c.type === 'mimic' && c.disguised) {
            const vis = Math.max(0.05, ill * 0.7 + 0.15);
            ctx.save();
            ctx.translate(c.x, c.y + Math.sin(c.phase * 0.8) * 2);
            ctx.globalAlpha = vis;
            // Looks like a skiff
            ctx.fillStyle = `rgba(90,80,60,${vis})`;
            ctx.beginPath();
            ctx.ellipse(0, 0, 10, 4, 0, 0, Math.PI);
            ctx.fill();
            ctx.fillStyle = `rgba(70,60,45,${vis})`;
            ctx.fillRect(-1, -5, 2, 4);
            // Fake lantern - slightly off color if you look closely
            const fakeLantern = 0.6 + Math.sin(time * 2.5 + c.phase) * 0.2;
            ctx.fillStyle = `rgba(240,160,40,${fakeLantern * vis})`;
            ctx.beginPath();
            ctx.arc(0, -5, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            continue;
        }

        const vis = Math.max(0.03, ill * 0.7);

        ctx.save();
        ctx.translate(c.x, c.y + undulate);

        // ── ABYSSAL: huge dark mass ──
        if (c.type === 'abyssal') {
            ctx.globalAlpha = Math.max(0.06, ill * 0.5); // always slightly visible as silhouette
            ctx.fillStyle = '#0c0515';
            ctx.beginPath();
            const segs = 12;
            for (let i = 0; i <= segs; i++) {
                const t = i / segs;
                const a = t * Math.PI * 2;
                const r = c.size * (0.85 + Math.sin(a * 2 + c.phase * 0.5) * 0.15);
                const px = Math.cos(a) * r;
                const py = Math.sin(a) * r * 0.6; // slightly flattened
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            // Faint inner glow
            if (ill > 0.2) {
                ctx.fillStyle = `rgba(100,40,120,${ill * 0.15})`;
                ctx.beginPath();
                ctx.arc(0, 0, c.size * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
            // Multiple dim eyes
            if (ill > 0.3) {
                ctx.fillStyle = CFG.colors.creatureEye;
                ctx.globalAlpha = ill * 0.6;
                for (let e = 0; e < 4; e++) {
                    const ex = (e - 1.5) * 8;
                    const ey = -5 + Math.sin(c.phase + e) * 2;
                    ctx.beginPath();
                    ctx.arc(ex, ey, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();
            continue;
        }

        // ── SHADE: ghostly, translucent ──
        if (c.type === 'shade') {
            ctx.globalAlpha = Math.max(0.04, ill * 0.5);
            // Shade is more vertical, wispy
            ctx.fillStyle = '#1a0825';
            ctx.beginPath();
            const segs = 10;
            for (let i = 0; i <= segs; i++) {
                const t = i / segs;
                const a = t * Math.PI * 2;
                const r = c.size * (0.6 + Math.sin(a * 2 + c.phase * 1.5) * 0.4);
                const px = Math.cos(a) * r * 0.7;
                const py = Math.sin(a) * r * 1.3; // tall and thin
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            // Faint face
            if (ill > 0.25) {
                ctx.fillStyle = `rgba(130,80,160,${ill * 0.4})`;
                ctx.beginPath();
                ctx.arc(-2, -3, 1.5, 0, Math.PI * 2);
                ctx.arc(2, -3, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
            continue;
        }

        // ── FLINCH: small, angular, twitchy ──
        if (c.type === 'flinch') {
            ctx.globalAlpha = c.frozen ? Math.max(0.15, ill * 0.8) : vis;
            ctx.fillStyle = c.frozen ? '#1a0a22' : CFG.colors.creature;
            ctx.beginPath();
            // Angular, spiky shape
            const segs = 6;
            for (let i = 0; i <= segs; i++) {
                const t = i / segs;
                const a = t * Math.PI * 2;
                const spike = i % 2 === 0 ? 1.3 : 0.7;
                const r = c.size * spike * (c.frozen ? 0.9 : (0.8 + Math.sin(c.phase * 4 + a * 2) * 0.3));
                const px = Math.cos(a) * r;
                const py = Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            if (ill > 0.3) {
                ctx.fillStyle = '#cc4466';
                ctx.globalAlpha = ill * 0.8;
                ctx.beginPath();
                ctx.arc(-2, -1, 1.5, 0, Math.PI * 2);
                ctx.arc(2, -1, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
            continue;
        }

        // ── LURKER + revealed MIMIC: standard organic shape ──
        ctx.globalAlpha = vis;
        ctx.fillStyle = c.mimicRevealed ? '#160a20' : CFG.colors.creature;
        ctx.beginPath();
        const segments = 8;
        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const a = t * Math.PI * 2;
            const r = c.size * (0.8 + Math.sin(a * 3 + c.phase) * 0.2);
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        if (ill > 0.3) {
            ctx.fillStyle = c.mimicRevealed ? '#aa3366' : CFG.colors.creatureEye;
            ctx.globalAlpha = ill * 0.8;
            ctx.beginPath();
            ctx.arc(-3, -2, 2, 0, Math.PI * 2);
            ctx.arc(3, -2, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }
}

// ── Night Stats ──
let nightStats = { saved: 0, lost: 0, merchantsSaved: 0, passengersSaved: 0, passengersLost: 0, creaturesRepelled: 0 };
let harborGlow = 0.1;
let wreckage = [];

function resetNightStats() {
    nightStats = { saved: 0, lost: 0, merchantsSaved: 0, passengersSaved: 0, passengersLost: 0, creaturesRepelled: 0 };
}

// ── Spawn Manager ──
let spawnTimer = 0;
let spawnQueue = [];

function buildSpawnQueue(nightCfg) {
    const q = [];
    for (let i = 0; i < (nightCfg.skiffs || 0); i++) q.push({ type: 'skiff', entity: 'ship' });
    for (let i = 0; i < (nightCfg.merchants || 0); i++) q.push({ type: 'merchant', entity: 'ship' });
    for (let i = 0; i < (nightCfg.passengers || 0); i++) q.push({ type: 'passenger', entity: 'ship' });
    for (let i = 0; i < (nightCfg.ghostShips || 0); i++) q.push({ type: 'ghostShip', entity: 'ship' });
    for (let i = 0; i < (nightCfg.lurkers || 0); i++) q.push({ type: 'lurker', entity: 'creature' });
    for (let i = 0; i < (nightCfg.flinches || 0); i++) q.push({ type: 'flinch', entity: 'creature' });
    for (let i = 0; i < (nightCfg.mimics || 0); i++) q.push({ type: 'mimic', entity: 'creature' });
    for (let i = 0; i < (nightCfg.abyssals || 0); i++) q.push({ type: 'abyssal', entity: 'creature' });
    for (let i = 0; i < (nightCfg.shades || 0); i++) q.push({ type: 'shade', entity: 'creature' });
    // Shuffle but keep ghost ships in middle third of night
    for (let i = q.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [q[i], q[j]] = [q[j], q[i]];
    }
    return q;
}

function startNight() {
    const cfg = CFG.nights[nightNum];
    ships = [];
    creatures = [];
    particles.length = 0;
    wreckage = [];
    beam.fuel = CFG.beam.fuelMax;
    beam.angle = -Math.PI / 2;
    beam.angularVel = 0;
    harborGlow = 0.1;
    nightTimer = 0;
    lighthouseDamage = 0;
    lighthouseDamageTimer = 0;
    activeEvent = cfg.event || null;
    activeWhispers = [];
    finaleTriggered = false;
    resetNightStats();
    spawnQueue = buildSpawnQueue(cfg);
    spawnTimer = 3;
    startAmbient();
}

// ── Rendering Helpers ──

function renderWater() {
    // Deep gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, CFG.colors.deepSky);
    grad.addColorStop(0.4, '#0b1830');
    grad.addColorStop(1, CFG.colors.darkWater);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Animated noise on water surface
    ctx.globalAlpha = 0.04;
    const scale = 0.008;
    const t = time * 0.15;
    for (let x = 0; x < W; x += 20) {
        for (let y = H * 0.3; y < H; y += 20) {
            const n = noise2d(x * scale + t, y * scale + t * 0.5);
            const brightness = (n + 1) * 0.5;
            ctx.fillStyle = `rgba(100,140,180,${brightness})`;
            ctx.fillRect(x, y, 20, 20);
        }
    }
    ctx.globalAlpha = 1;

    // Faint stars
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 40; i++) {
        const sx = ((i * 137.5) % W);
        const sy = ((i * 97.3) % (H * 0.35));
        const twinkle = 0.2 + Math.sin(time * (1 + i * 0.1) + i) * 0.15;
        ctx.globalAlpha = twinkle;
        ctx.beginPath();
        ctx.arc(sx, sy, 0.5 + (i % 3) * 0.3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function renderLighthouse() {
    const lx = lighthouse.x;
    const ly = lighthouse.y;
    const lw = lighthouse.width;
    const lh = lighthouse.height;

    ctx.save();
    ctx.translate(lx, ly);

    // Tower body
    const stoneGrad = ctx.createLinearGradient(-lw/2, -lh, lw/2, 0);
    stoneGrad.addColorStop(0, CFG.colors.stoneLight);
    stoneGrad.addColorStop(0.5, CFG.colors.stone);
    stoneGrad.addColorStop(1, '#2a2520');
    ctx.fillStyle = stoneGrad;
    ctx.beginPath();
    ctx.moveTo(-lw / 2, 0);
    ctx.lineTo(-lw / 2.5, -lh);
    ctx.lineTo(lw / 2.5, -lh);
    ctx.lineTo(lw / 2, 0);
    ctx.closePath();
    ctx.fill();

    // Stripes
    ctx.fillStyle = 'rgba(180,40,40,0.4)';
    for (let i = 0; i < 3; i++) {
        const sy = -lh * (0.2 + i * 0.25);
        const sw = lw * (0.85 - i * 0.05);
        ctx.fillRect(-sw / 2, sy, sw, lh * 0.08);
    }

    // Lantern room at top
    ctx.fillStyle = '#555045';
    ctx.fillRect(-lw / 3, -lh - 12, lw / 1.5, 14);

    // Light source glow
    const glowSize = 12 + Math.sin(time * 2) * 2;
    const fr = beam.fuelRatio;
    ctx.fillStyle = `rgba(255,204,68,${0.6 * fr})`;
    ctx.beginPath();
    ctx.arc(0, -lh - 5, glowSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,248,224,${0.3 * fr})`;
    ctx.beginPath();
    ctx.arc(0, -lh - 5, glowSize * 2, 0, Math.PI * 2);
    ctx.fill();

    // Base rocks
    ctx.fillStyle = '#1a1a18';
    for (let i = -3; i <= 3; i++) {
        const rx = i * 12 + Math.sin(i * 2) * 4;
        const ry = 5 + Math.abs(i) * 3;
        ctx.beginPath();
        ctx.ellipse(rx, ry, 10 + Math.abs(i) * 2, 6, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function renderHarborGlow() {
    harborGlow = Math.min(1, harborGlow);
    const glow = harborGlow * (0.8 + Math.sin(time * 0.5) * 0.2);
    const grad = ctx.createRadialGradient(lighthouse.x, H, 10, lighthouse.x, H, 150);
    grad.addColorStop(0, `rgba(255,204,68,${glow * 0.15})`);
    grad.addColorStop(1, 'rgba(255,204,68,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(lighthouse.x - 160, H - 160, 320, 160);
}

function renderWreckage() {
    for (const w of wreckage) {
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = CFG.colors.wreckage;
        ctx.fillRect(w.x - 4, w.y - 2, 8, 4);
        ctx.fillRect(w.x - 1, w.y - 6, 2, 8);
    }
    ctx.globalAlpha = 1;
}

// ── Ambient Events ──
let lightningTimer = 15 + Math.random() * 30;
let lightningFlash = 0;

function updateAmbient(dt) {
    lightningTimer -= dt;
    if (lightningTimer <= 0) {
        lightningFlash = 0.15;
        lightningTimer = 20 + Math.random() * 40;
    }
    if (lightningFlash > 0) lightningFlash -= dt;

    // Occasional bioluminescent plankton
    if (Math.random() < 0.005) {
        const px = Math.random() * W;
        const py = H * 0.4 + Math.random() * H * 0.5;
        for (let i = 0; i < 3; i++) {
            spawnParticle(px + (Math.random() - 0.5) * 20, py + (Math.random() - 0.5) * 10, {
                speed: 3, color: '#44aaaa', life: 1 + Math.random(), size: 1, gravity: 0,
            });
        }
    }
}

// ── Title Screen ──
function renderTitle() {
    renderWater();

    // Lighthouse silhouette
    lighthouse.x = W / 2;
    lighthouse.y = H * 0.72;
    renderLighthouse();

    // Dim beam sweep
    const sweepAngle = -Math.PI / 2 + Math.sin(time * 0.4) * 0.6;
    ctx.save();
    ctx.translate(lighthouse.lightX, lighthouse.lightY);
    const tGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, H * 0.5);
    tGrad.addColorStop(0, 'rgba(255,204,68,0.06)');
    tGrad.addColorStop(1, 'rgba(255,204,68,0)');
    ctx.fillStyle = tGrad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, H * 0.5, sweepAngle - 0.25, sweepAngle + 0.25);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Title text
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const titleY = H * 0.28;
    const pulse = 1 + Math.sin(time * 1.5) * 0.02;

    ctx.save();
    ctx.translate(W / 2, titleY);
    ctx.scale(pulse, pulse);

    // Glow
    ctx.shadowColor = '#ffcc44';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#ffcc44';
    ctx.font = `bold ${Math.min(72, W * 0.08)}px Georgia, serif`;
    ctx.fillText('LAST LIGHT', 0, 0);
    ctx.shadowBlur = 0;

    // Crisp overlay
    ctx.fillStyle = '#fff8e0';
    ctx.fillText('LAST LIGHT', 0, 0);
    ctx.restore();

    // Subtitle
    ctx.fillStyle = `rgba(180,170,150,${0.5 + Math.sin(time * 2) * 0.2})`;
    ctx.font = `${Math.min(18, W * 0.025)}px Georgia, serif`;
    ctx.fillText('A lighthouse keeper\u2019s vigil against the dark', W / 2, titleY + 50);

    // Start prompt
    const promptAlpha = 0.3 + Math.sin(time * 3) * 0.3;
    ctx.fillStyle = `rgba(255,248,224,${promptAlpha})`;
    ctx.font = `${Math.min(16, W * 0.022)}px Georgia, serif`;
    ctx.fillText(input.touched ? 'Tap to begin' : 'Click or press Enter to begin', W / 2, H * 0.6);

    // Vignette
    renderVignette();
}

function renderVignette() {
    const grad = ctx.createRadialGradient(W/2, H/2, H * 0.3, W/2, H/2, H * 0.8);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
}

// ── Night Intro ──
function renderNightIntro() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    const cfg = CFG.nights[nightNum];
    const alpha = stateTimer < 0.5 ? stateTimer / 0.5 : stateTimer > 2.5 ? 1 - (stateTimer - 2.5) / 0.5 : 1;

    ctx.globalAlpha = Math.max(0, alpha);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#ffcc44';
    ctx.font = `bold ${Math.min(36, W * 0.05)}px Georgia, serif`;
    ctx.fillText(`Night ${nightNum + 1}`, W / 2, H * 0.4);

    ctx.fillStyle = '#aaa8a0';
    ctx.font = `${Math.min(16, W * 0.022)}px Georgia, serif`;
    ctx.fillText(cfg.desc || '', W / 2, H * 0.5);

    ctx.globalAlpha = 1;

    if (stateTimer > 3.0) {
        state = GameState.PLAYING;
        onStateEnter(GameState.PLAYING);
    }
}

// ── Dawn Debrief ──
function renderDawn() {
    // Sunrise gradient
    const dawnProgress = Math.min(1, stateTimer / 3);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    const r = Math.floor(lerp(6, 60, dawnProgress));
    const g = Math.floor(lerp(13, 40, dawnProgress));
    const b = Math.floor(lerp(26, 50, dawnProgress));
    const r2 = Math.floor(lerp(10, 180, dawnProgress));
    const g2 = Math.floor(lerp(24, 120, dawnProgress));
    const b2 = Math.floor(lerp(48, 80, dawnProgress));
    grad.addColorStop(0, `rgb(${r},${g},${b})`);
    grad.addColorStop(0.5, `rgb(${r2},${g2},${b2})`);
    grad.addColorStop(1, `rgb(${Math.floor(r2*0.7)},${Math.floor(g2*0.6)},${Math.floor(b2*0.5)})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Sun on horizon
    if (dawnProgress > 0.3) {
        const sunAlpha = (dawnProgress - 0.3) / 0.7;
        const sunY = H * 0.45 - sunAlpha * H * 0.05;
        ctx.fillStyle = `rgba(255,200,100,${sunAlpha * 0.4})`;
        ctx.beginPath();
        ctx.arc(W / 2, sunY, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,220,150,${sunAlpha * 0.15})`;
        ctx.beginPath();
        ctx.arc(W / 2, sunY, 100, 0, Math.PI * 2);
        ctx.fill();
    }

    // Lighthouse silhouette
    renderLighthouse();

    // Harbor with saved ships
    for (let i = 0; i < nightStats.saved; i++) {
        const sx = lighthouse.x - 60 + i * 25 + Math.sin(i * 1.3) * 10;
        const sy = lighthouse.y + 20 + Math.sin(time + i) * 2;
        ctx.fillStyle = `rgba(80,70,55,${0.6 * dawnProgress})`;
        ctx.beginPath();
        ctx.ellipse(sx, sy, 8, 3, 0, 0, Math.PI);
        ctx.fill();
        ctx.fillRect(sx - 0.5, sy - 8, 1, 8);
    }

    // Wreckage on rocks
    for (let i = 0; i < nightStats.lost; i++) {
        const wx = lighthouse.x + (i % 2 === 0 ? -1 : 1) * (80 + i * 20);
        const wy = lighthouse.y + 10 + Math.sin(i * 2) * 5;
        ctx.fillStyle = `rgba(74,56,40,${0.5 * dawnProgress})`;
        ctx.fillRect(wx - 5, wy - 2, 10, 4);
        ctx.fillRect(wx - 1, wy - 7, 2, 8);
    }

    // Stats text
    if (stateTimer > 1.5) {
        const textAlpha = Math.min(1, (stateTimer - 1.5) / 1.0);
        ctx.globalAlpha = textAlpha;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.fillStyle = '#3a3530';
        ctx.font = `italic ${Math.min(16, W * 0.022)}px Georgia, serif`;
        ctx.fillText(`Night ${nightNum}`, W / 2, H * 0.15);

        const total = nightStats.saved + nightStats.lost;
        let summary;
        if (nightStats.lost === 0) {
            summary = `All ${total} vessels found harbor. A perfect night.`;
        } else if (nightStats.saved === 0) {
            summary = `${total} vessels sought the light. None found harbor.`;
        } else {
            summary = `Of ${total} vessels that sought the light, ${nightStats.saved} found harbor.`;
        }

        ctx.fillStyle = '#2a2520';
        ctx.font = `${Math.min(18, W * 0.025)}px Georgia, serif`;
        ctx.fillText(summary, W / 2, H * 0.22);

        if (nightStats.lost > 0) {
            ctx.fillStyle = '#5a4838';
            ctx.font = `italic ${Math.min(14, W * 0.02)}px Georgia, serif`;
            ctx.fillText(`${nightStats.lost} met the rocks.`, W / 2, H * 0.28);
        }

        // Journal entry from previous keeper
        const journalEntry = getJournalEntry(nightNum - 1);
        if (journalEntry) {
            ctx.fillStyle = '#4a4538';
            ctx.font = `italic ${Math.min(13, W * 0.018)}px Georgia, serif`;
            // Word-wrap the journal entry
            const maxWidth = W * 0.7;
            const words = journalEntry.split(' ');
            let line = '';
            let journalY = H * 0.35;
            for (const word of words) {
                const testLine = line + (line ? ' ' : '') + word;
                if (ctx.measureText(testLine).width > maxWidth) {
                    ctx.fillText(line, W / 2, journalY);
                    line = word;
                    journalY += 18;
                } else {
                    line = testLine;
                }
            }
            if (line) ctx.fillText(line, W / 2, journalY);
        }

        ctx.globalAlpha = 1;
    }

    // Continue prompt
    if (stateTimer > 2.0) {
        const pa = 0.3 + Math.sin(time * 3) * 0.2;
        ctx.fillStyle = `rgba(58,53,48,${pa})`;
        ctx.textAlign = 'center';
        ctx.font = `${Math.min(14, W * 0.02)}px Georgia, serif`;
        const nextText = nightNum < CFG.nights.length ? 'Click to continue' : 'Click to return';
        ctx.fillText(nextText, W / 2, H * 0.88);
    }

    renderVignette();
}

// ── Gameplay Render ──
function renderGameplay() {
    renderWater();

    // Environmental event overlays
    if (activeEvent === 'fog') {
        // Fog: milky overlay on part of the screen
        const fogGrad = ctx.createRadialGradient(W * 0.3, H * 0.3, 50, W * 0.3, H * 0.3, H * 0.5);
        fogGrad.addColorStop(0, 'rgba(140,150,160,0.12)');
        fogGrad.addColorStop(1, 'rgba(140,150,160,0)');
        ctx.fillStyle = fogGrad;
        ctx.fillRect(0, 0, W, H);
    }
    if (activeEvent === 'redTide') {
        // Bioluminescent red-green glow on water
        ctx.fillStyle = 'rgba(60,120,80,0.04)';
        ctx.fillRect(0, H * 0.35, W, H * 0.65);
        // Extra plankton particles
        if (Math.random() < 0.06) {
            spawnParticle(Math.random() * W, H * 0.4 + Math.random() * H * 0.5, {
                speed: 2, color: '#55bbaa', life: 1.5, size: 1.2, gravity: 0,
            });
        }
    }
    if (activeEvent === 'newMoon') {
        // Extra dark overlay
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(0, 0, W, H);
    }

    // Lightning flash
    if (lightningFlash > 0) {
        ctx.fillStyle = `rgba(150,160,180,${lightningFlash})`;
        ctx.fillRect(0, 0, W, H);
    }

    renderHarborGlow();
    renderWreckage();
    renderCreatures();
    renderShips();

    // Beam renders on top of entities but below lighthouse
    lighthouse.x = W / 2;
    lighthouse.y = H * 0.82;

    // Lighthouse damage flicker
    if (lighthouseDamage > 0) {
        if (Math.random() < 0.3) {
            // Skip rendering beam occasionally when damaged (flicker)
        } else {
            beam.render();
        }
    } else {
        beam.render();
    }

    renderLighthouse();
    renderParticles();
    renderWhispers();
    renderVignette();

    // Night timer urgency glow
    const nightDuration = CFG.nights[nightNum] ? CFG.nights[nightNum].duration || CFG.night.duration : CFG.night.duration;
    if (nightTimer > 0) {
        const remaining = Math.max(0, nightDuration - nightTimer);
        if (remaining < 20) {
            const urgency = 1 - remaining / 20;
            ctx.fillStyle = `rgba(255,200,100,${urgency * 0.05})`;
            ctx.fillRect(0, 0, W, H);
        }
    }

    // Lighthouse damage indicator
    if (lighthouseDamage > 0) {
        ctx.fillStyle = `rgba(80,30,100,${lighthouseDamage * 0.1 * (0.5 + Math.random() * 0.5)})`;
        ctx.fillRect(0, 0, W, H);
    }

    // Fog horn reveal flash
    if (fogHornActive > 0) {
        const pulse = fogHornActive / FOG_HORN_DURATION;
