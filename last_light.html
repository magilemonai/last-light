        const grad = ctx.createRadialGradient(lighthouse.lightX, lighthouse.lightY, 10, lighthouse.lightX, lighthouse.lightY, Math.max(W, H) * 0.7);
        grad.addColorStop(0, `rgba(255,248,224,${pulse * 0.08})`);
        grad.addColorStop(1, 'rgba(255,248,224,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
    }

    // Spyglass zoom indicator
    if (spyglassActive > 0) {
        ctx.strokeStyle = `rgba(255,204,68,${0.2 * (spyglassActive / SPYGLASS_DURATION)})`;
        ctx.lineWidth = 1;
        const sLen = beam.getLength() * 1.5;
        const sCone = beam.getConeAngle() * 0.3;
        ctx.beginPath();
        ctx.moveTo(lighthouse.lightX, lighthouse.lightY);
        ctx.arc(lighthouse.lightX, lighthouse.lightY, sLen, beam.angle - sCone, beam.angle + sCone);
        ctx.closePath();
        ctx.stroke();
    }

    // Ability cooldown indicators (subtle, bottom-left)
    let abilityY = H - 20;
    ctx.textAlign = 'left';
    ctx.font = `${Math.min(11, W * 0.015)}px Georgia, serif`;
    if (campaign.upgrades.includes('fogHorn')) {
        const ready = fogHornCooldown <= 0;
        ctx.fillStyle = ready ? 'rgba(255,248,224,0.4)' : 'rgba(255,248,224,0.15)';
        ctx.fillText(`[F] Horn ${ready ? '\u2022' : Math.ceil(fogHornCooldown) + 's'}`, 10, abilityY);
        abilityY -= 16;
    }
    if (campaign.upgrades.includes('spyglass')) {
        const ready = spyglassCooldown <= 0;
        ctx.fillStyle = ready ? 'rgba(255,248,224,0.4)' : 'rgba(255,248,224,0.15)';
        ctx.fillText(`[G] Glass ${ready ? '\u2022' : Math.ceil(spyglassCooldown) + 's'}`, 10, abilityY);
    }
    ctx.textAlign = 'center';
}

// ── Main Update ──
function updateGameplay(dt) {
    nightTimer += dt;
    beam.update(dt);
    updateShips(dt);
    updateCreatures(dt);
    updateParticles(dt);
    updateAmbient(dt);
    updateWhispers(dt);

    // Ability cooldowns
    if (fogHornCooldown > 0) fogHornCooldown -= dt;
    if (spyglassCooldown > 0) spyglassCooldown -= dt;
    if (fogHornActive > 0) fogHornActive -= dt;
    if (spyglassActive > 0) spyglassActive -= dt;

    // Fog Horn activation
    if (input.fogHornKey && fogHornCooldown <= 0 && campaign.upgrades.includes('fogHorn')) {
        fogHornActive = FOG_HORN_DURATION;
        fogHornCooldown = FOG_HORN_COOLDOWN;
        playSound('horn');
    }
    // Spyglass activation
    if (input.spyglassKey && spyglassCooldown <= 0 && campaign.upgrades.includes('spyglass')) {
        spyglassActive = SPYGLASS_DURATION;
        spyglassCooldown = SPYGLASS_COOLDOWN;
    }

    // Lighthouse damage decay
    if (lighthouseDamageTimer > 0) {
        lighthouseDamageTimer -= dt;
        if (lighthouseDamageTimer <= 0) {
            lighthouseDamage = 0;
            lighthouseDamageTimer = 0;
        }
    }

    // Spawn logic
    const cfg = CFG.nights[nightNum];
    if (spawnQueue.length > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
            const next = spawnQueue.shift();
            if (next.entity === 'ship') spawnShip(next.type);
            else spawnCreature(next.type);
            const [minI, maxI] = cfg.spawnInterval;
            spawnTimer = minI + Math.random() * (maxI - minI);
        }
    }

    const nightDuration = cfg.duration || CFG.night.duration;

    // Night 15 finale: beam fails at 60%
    if (cfg.finale && nightTimer >= nightDuration * 0.6 && !finaleTriggered) {
        finaleTriggered = true;
        state = GameState.FINALE_DARK;
        stateTimer = 0;
        // Cut all sound
        if (ambientNode) {
            ambientNode.gain.gain.setValueAtTime(0, getAudio().currentTime);
        }
        return;
    }

    // Night end: all spawned and all non-ghost ships resolved
    const activeShips = ships.filter(s => s.type !== 'ghostShip');
    if (spawnQueue.length === 0 && activeShips.length === 0 && nightTimer > 10) {
        endNight();
    }

    // Also end if timer runs out
    if (nightTimer >= nightDuration) {
        endNight();
    }
}

function endNight() {
    // Record night results
    campaign.nightResults[nightNum] = {
        saved: nightStats.saved,
        lost: nightStats.lost,
        passengersLost: nightStats.passengersLost,
    };
    campaign.totalSaved += nightStats.saved;
    campaign.totalLost += nightStats.lost;

    nightNum++;

    playSound('dawn');
    changeState(GameState.DAWN, 1.5);

    if (nightNum >= CFG.nights.length) {
        clearSave();
    } else {
        saveCampaign();
    }
}

// ── Game Loop ──
const TICK = 1 / 60;
let acc = 0;
let prevTime = 0;

function loop(ts) {
    requestAnimationFrame(loop);

    const dt = Math.min((ts - prevTime) / 1000, 0.1);
    prevTime = ts;
    time += dt;
    stateTimer += dt;

    // Update
    if (state === GameState.PLAYING) {
        acc += dt;
        while (acc >= TICK) {
            updateGameplay(TICK);
            acc -= TICK;
        }
    }

    // Render
    ctx.clearRect(0, 0, W, H);

    switch (state) {
        case GameState.TITLE:
            renderTitle();
            break;
        case GameState.PLAYING:
            renderGameplay();
            break;
        case GameState.DAWN:
            renderDawn();
            break;
        case GameState.NIGHT_INTRO:
            renderNightIntro();
            break;
        case GameState.UPGRADE:
            renderUpgrade();
            break;
        case GameState.KEEPERS_RECORD:
            renderKeepersRecord();
            break;
        case GameState.FINALE_DARK:
            renderFinaleDark();
            break;
        case GameState.FINALE_CHOICE:
            renderFinaleChoice();
            break;
        case GameState.FINALE_END:
            renderFinaleEnd();
            break;
        case GameState.TRANSITION:
            const progress = Math.min(1, stateTimer / transitionDuration);
            // Fade through black
            if (progress < 0.5) {
                // Render old state fading out
                renderState(transitionFrom);
                ctx.fillStyle = `rgba(0,0,0,${ease.inQuad(progress * 2)})`;
                ctx.fillRect(0, 0, W, H);
            } else {
                // Render new state fading in
                renderState(transitionTo);
                ctx.fillStyle = `rgba(0,0,0,${1 - ease.outCubic((progress - 0.5) * 2)})`;
                ctx.fillRect(0, 0, W, H);
            }
            if (progress >= 1) {
                state = transitionTo;
                onStateEnter(transitionTo);
            }
            break;
    }

    // Custom cursor
    if (state === GameState.PLAYING) {
        ctx.strokeStyle = `rgba(255,248,224,${0.3 + beam.fuelRatio * 0.3})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(input.mx, input.my, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(input.mx, input.my - 3);
        ctx.lineTo(input.mx, input.my + 3);
        ctx.moveTo(input.mx - 3, input.my);
        ctx.lineTo(input.mx + 3, input.my);
        ctx.stroke();
    }
}

// ── Upgrade Screen ──
function renderUpgrade() {
    // Dark background with faint lighthouse
    ctx.fillStyle = '#0a0e14';
    ctx.fillRect(0, 0, W, H);

    lighthouse.x = W / 2;
    lighthouse.y = H * 0.82;

    // Dim lighthouse silhouette
    ctx.globalAlpha = 0.15;
    renderLighthouse();
    ctx.globalAlpha = 1;

    const fadeIn = Math.min(1, stateTimer / 1.0);
    ctx.globalAlpha = fadeIn;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Header
    ctx.fillStyle = '#aaa8a0';
    ctx.font = `italic ${Math.min(16, W * 0.022)}px Georgia, serif`;
    ctx.fillText('Preparations for the coming night', W / 2, H * 0.15);

    ctx.fillStyle = '#ffcc44';
    ctx.font = `bold ${Math.min(22, W * 0.03)}px Georgia, serif`;
    ctx.fillText('Choose one:', W / 2, H * 0.25);

    // Upgrade options
    const optionW = W * 0.6;
    const optionH = 60;
    const startX = (W - optionW) / 2;
    const startY = H * 0.35;

    for (let i = 0; i < upgradeChoices.length; i++) {
        const key = upgradeChoices[i];
        const up = UPGRADES[key];
        const y = startY + i * (optionH + 15);
        const selected = upgradeSelected === i;
        const hover = input.my >= y && input.my <= y + optionH &&
                      input.mx >= startX && input.mx <= startX + optionW;

        // Box
        ctx.fillStyle = selected ? 'rgba(255,204,68,0.15)' : hover ? 'rgba(255,248,224,0.06)' : 'rgba(255,248,224,0.03)';
        ctx.strokeStyle = selected ? '#ffcc44' : hover ? 'rgba(255,248,224,0.3)' : 'rgba(255,248,224,0.1)';
        ctx.lineWidth = selected ? 2 : 1;
        ctx.beginPath();
        ctx.roundRect(startX, y, optionW, optionH, 4);
        ctx.fill();
        ctx.stroke();

        // Prompt text (what the keeper sees)
        ctx.textAlign = 'left';
        ctx.fillStyle = selected ? '#ffcc44' : '#ccc8b8';
        ctx.font = `${Math.min(16, W * 0.022)}px Georgia, serif`;
        ctx.fillText(up.prompt, startX + 15, y + 22);

        // Effect description
        ctx.fillStyle = selected ? '#ddd8c8' : '#888580';
        ctx.font = `italic ${Math.min(13, W * 0.018)}px Georgia, serif`;
        ctx.fillText(up.desc.split('. ').slice(1).join('. '), startX + 15, y + 42);

        ctx.textAlign = 'center';
    }

    // Confirm prompt
    if (upgradeSelected >= 0) {
        const pa = 0.4 + Math.sin(time * 3) * 0.2;
        ctx.fillStyle = `rgba(255,204,68,${pa})`;
        ctx.font = `${Math.min(14, W * 0.02)}px Georgia, serif`;
        ctx.fillText('Click again to confirm', W / 2, H * 0.88);
    }

    // Ability key hints if applicable
    if (campaign.upgrades.includes('fogHorn') || campaign.upgrades.includes('spyglass')) {
        ctx.fillStyle = 'rgba(150,145,135,0.5)';
        ctx.font = `${Math.min(12, W * 0.016)}px Georgia, serif`;
        let hints = [];
        if (campaign.upgrades.includes('fogHorn')) hints.push('F — Fog Horn');
        if (campaign.upgrades.includes('spyglass')) hints.push('G — Spyglass');
        ctx.fillText(hints.join('    '), W / 2, H * 0.94);
    }

    ctx.globalAlpha = 1;
    renderVignette();
}

function renderState(s) {
    switch (s) {
        case GameState.TITLE: renderTitle(); break;
        case GameState.PLAYING: renderGameplay(); break;
        case GameState.DAWN: renderDawn(); break;
        case GameState.NIGHT_INTRO: renderNightIntro(); break;
        case GameState.UPGRADE: renderUpgrade(); break;
        case GameState.KEEPERS_RECORD: renderKeepersRecord(); break;
        case GameState.FINALE_DARK: renderFinaleDark(); break;
        case GameState.FINALE_CHOICE: renderFinaleChoice(); break;
        case GameState.FINALE_END: renderFinaleEnd(); break;
    }
}

// ── Night 15 Finale ──
function renderFinaleDark() {
    // Total darkness. Just ocean sound reference.
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // After 4 seconds, transition to choice
    if (stateTimer > 4.0) {
        state = GameState.FINALE_CHOICE;
        stateTimer = 0;
    }
}

let finaleChoiceHover = -1;
function renderFinaleChoice() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Faint ocean suggestion
    ctx.globalAlpha = 0.02;
    for (let x = 0; x < W; x += 30) {
        const n = noise2d(x * 0.005 + time * 0.1, time * 0.05);
        ctx.fillStyle = `rgba(100,140,180,${(n + 1) * 0.5})`;
        ctx.fillRect(x, H * 0.7 + n * 20, 30, 4);
    }
    ctx.globalAlpha = 1;

    const fadeIn = Math.min(1, stateTimer / 2.0);
    ctx.globalAlpha = fadeIn;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // The two choices
    const choice1Y = H * 0.42;
    const choice2Y = H * 0.56;

    const hover1 = Math.abs(input.my - choice1Y) < 20 && Math.abs(input.mx - W / 2) < W * 0.3;
    const hover2 = Math.abs(input.my - choice2Y) < 20 && Math.abs(input.mx - W / 2) < W * 0.3;
    finaleChoiceHover = hover1 ? 0 : hover2 ? 1 : -1;

    ctx.fillStyle = hover1 ? '#ffcc44' : 'rgba(255,248,224,0.6)';
    ctx.font = `italic ${Math.min(18, W * 0.025)}px Georgia, serif`;
    ctx.fillText('Relight the beam. Continue the watch.', W / 2, choice1Y);

    ctx.fillStyle = hover2 ? '#ffcc44' : 'rgba(255,248,224,0.6)';
    ctx.fillText('Leave the lighthouse. Walk down to the shore.', W / 2, choice2Y);

    ctx.globalAlpha = 1;
}

function renderFinaleEnd() {
    const fadeIn = Math.min(1, stateTimer / 2.0);

    if (campaign.finalChoice === 'relight') {
        // Beam returns at half power, finish the night
        if (stateTimer < 2.0) {
            // Fade from black to gameplay
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, W, H);
            ctx.globalAlpha = fadeIn;
            ctx.fillStyle = '#ffcc44';
            ctx.textAlign = 'center';
            ctx.font = `italic ${Math.min(16, W * 0.022)}px Georgia, serif`;
            ctx.fillText('The light returns.', W / 2, H / 2);
            ctx.globalAlpha = 1;
        } else {
            // Resume gameplay with weakened beam
            beam.fuel = CFG.beam.fuelMax * 0.5;
            state = GameState.PLAYING;
            // Restart ambient
            if (ambientNode) {
                ambientNode.gain.gain.setValueAtTime(0.04, getAudio().currentTime);
            }
        }
    } else {
        // "Leave" ending - slow fade with final text
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);

        // Small lighthouse light in distance, shrinking
        const lightSize = Math.max(1, 8 - stateTimer * 0.8);
        const lightAlpha = Math.max(0, 0.5 - stateTimer * 0.05);
        ctx.fillStyle = `rgba(255,204,68,${lightAlpha})`;
        ctx.beginPath();
        ctx.arc(W / 2, H * 0.3, lightSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,204,68,${lightAlpha * 0.3})`;
        ctx.beginPath();
        ctx.arc(W / 2, H * 0.3, lightSize * 3, 0, Math.PI * 2);
        ctx.fill();

        // Final text appears
        if (stateTimer > 3.0) {
            const textAlpha = Math.min(1, (stateTimer - 3.0) / 2.0);
            ctx.globalAlpha = textAlpha;
            ctx.fillStyle = '#aaa8a0';
            ctx.textAlign = 'center';
            ctx.font = `italic ${Math.min(16, W * 0.022)}px Georgia, serif`;
            ctx.fillText('The sound of waves on stone. The cold air on your face.', W / 2, H * 0.6);
            ctx.fillText('Behind you, the beam is dark.', W / 2, H * 0.65);
            ctx.globalAlpha = 1;
        }

        if (stateTimer > 8.0) {
            // End — go to keeper's record
            nightNum = CFG.nights.length; // ensure we're past all nights
            endNight();
        }
    }
}

// ── Keeper's Record ──
function renderKeepersRecord() {
    ctx.fillStyle = '#1a1610';
    ctx.fillRect(0, 0, W, H);

    const fadeIn = Math.min(1, stateTimer / 2.0);
    ctx.globalAlpha = fadeIn;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Aged paper background
    ctx.fillStyle = '#2a2418';
    const paperW = Math.min(W * 0.8, 600);
    const paperH = H * 0.8;
    const paperX = (W - paperW) / 2;
    const paperY = H * 0.1;
    ctx.fillRect(paperX, paperY, paperW, paperH);
    ctx.strokeStyle = '#3a3428';
    ctx.lineWidth = 2;
    ctx.strokeRect(paperX, paperY, paperW, paperH);

    // Header
    ctx.fillStyle = '#aa9870';
    ctx.font = `bold ${Math.min(24, W * 0.035)}px Georgia, serif`;
    ctx.fillText('THE KEEPER\'S RECORD', W / 2, paperY + 40);

    ctx.fillStyle = '#887858';
    ctx.font = `italic ${Math.min(14, W * 0.02)}px Georgia, serif`;
    ctx.fillText('Nights 1 through 15', W / 2, paperY + 65);

    // Tally
    const totalShips = campaign.totalSaved + campaign.totalLost;
    ctx.fillStyle = '#ccb888';
    ctx.font = `${Math.min(16, W * 0.022)}px Georgia, serif`;
    if (campaign.totalLost === 0) {
        ctx.fillText(`All ${totalShips} vessels found harbor.`, W / 2, paperY + 110);
    } else {
        ctx.fillText(`Of ${totalShips} vessels that sought the light, ${campaign.totalSaved} found harbor.`, W / 2, paperY + 110);
    }

    // Night map: 15 cells
    const cellSize = Math.min(20, (paperW - 60) / 15);
    const mapX = W / 2 - (15 * cellSize) / 2;
    const mapY = paperY + 150;

    for (let i = 0; i < 15; i++) {
        const result = campaign.nightResults[i];
        let ratio = 1;
        if (result) {
            const total = result.saved + result.lost;
            ratio = total > 0 ? result.saved / total : 1;
        }
        // Gold (good) to dark red (bad)
        const r = Math.floor(lerp(80, 255, ratio));
        const g = Math.floor(lerp(20, 200, ratio));
        const b = Math.floor(lerp(20, 68, ratio));
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fillRect(mapX + i * cellSize, mapY, cellSize - 2, cellSize - 2);

        // Night number below every 5th
        if ((i + 1) % 5 === 0 || i === 0) {
            ctx.fillStyle = '#665840';
            ctx.font = `${Math.min(10, W * 0.013)}px Georgia, serif`;
            ctx.fillText(`${i + 1}`, mapX + i * cellSize + cellSize / 2 - 1, mapY + cellSize + 12);
        }
    }

    // Week labels
    ctx.fillStyle = '#665840';
    ctx.font = `italic ${Math.min(11, W * 0.015)}px Georgia, serif`;
    ctx.fillText('The Routine', mapX + 3 * cellSize, mapY + cellSize + 28);
    ctx.fillText('The Deterioration', mapX + 10 * cellSize, mapY + cellSize + 28);
    ctx.fillText('The Reckoning', mapX + 18 * cellSize, mapY + cellSize + 28);

    // Whisper
    const whisperY = mapY + cellSize + 60;
    ctx.fillStyle = '#8878a8';
    ctx.font = `italic ${Math.min(14, W * 0.02)}px Georgia, serif`;
    if (campaign.whispersCollected.length >= 12) {
        ctx.fillText('"' + campaign.whispersCollected.join(' ') + '"', W / 2, whisperY);
    } else if (campaign.whispersCollected.length > 0) {
        ctx.fillText('"' + campaign.whispersCollected.join(' ') + '..."', W / 2, whisperY);
        ctx.fillStyle = '#665850';
        ctx.fillText('Something spoke from the water. You did not hear it all.', W / 2, whisperY + 22);
    } else {
        ctx.fillStyle = '#665850';
        ctx.fillText('Something spoke from the water. You did not hear it all.', W / 2, whisperY);
    }

    // Final line
    const finalY = paperY + paperH - 50;
    ctx.fillStyle = '#ccb888';
    ctx.font = `${Math.min(16, W * 0.022)}px Georgia, serif`;
    const ratio = campaign.totalSaved / Math.max(1, campaign.totalSaved + campaign.totalLost);
    let finalLine;
    if (campaign.finalChoice === 'relight') {
        finalLine = ratio > 0.7 ? 'The light held. The coast remembers.' :
                    ratio > 0.4 ? 'The light held, though the cost was heavy.' :
                    'The light held. But the dark took its share.';
    } else if (campaign.finalChoice === 'leave') {
        finalLine = ratio > 0.7 ? 'They found their way. You found the shore.' :
                    ratio > 0.4 ? 'Some found harbor. You found the shore.' :
                    'The dark claimed its due. You chose the shore.';
    } else {
        finalLine = ratio > 0.7 ? 'The light held. The coast remembers.' :
                    'The night passes. The sea endures.';
    }
    ctx.fillText(finalLine, W / 2, finalY);

    ctx.globalAlpha = 1;

    // Return prompt
    if (stateTimer > 3.0) {
        const pa = 0.3 + Math.sin(time * 3) * 0.2;
        ctx.fillStyle = `rgba(170,152,112,${pa})`;
        ctx.font = `${Math.min(13, W * 0.018)}px Georgia, serif`;
        ctx.fillText('Click to return', W / 2, H * 0.95);
    }
}

// ── Campaign Persistence ──
function saveCampaign() {
    try {
        localStorage.setItem('lastLight_campaign', JSON.stringify({
            nightNum, campaign,
            upgrades: campaign.upgrades,
        }));
    } catch(e) {}
}

function loadCampaign() {
    try {
        const data = JSON.parse(localStorage.getItem('lastLight_campaign'));
        if (data && data.nightNum > 0 && data.nightNum < CFG.nights.length) {
            nightNum = data.nightNum;
            Object.assign(campaign, data.campaign);
            applyUpgrades();
            return true;
        }
    } catch(e) {}
    return false;
}

function clearSave() {
    try { localStorage.removeItem('lastLight_campaign'); } catch(e) {}
}

// ── Initialize ──
lighthouse.x = W / 2;
lighthouse.y = H * 0.82;
requestAnimationFrame(loop);

</script>
