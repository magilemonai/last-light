<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Last Light</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════
// LAST LIGHT — Prototype
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── Configuration ──
const CFG = {
    // Beam
    beam: {
        maxAngularVel: 2.2,       // radians/sec max rotation speed
        angularAccel: 8.0,        // how fast it accelerates to target
        angularDamping: 0.88,     // friction on angular velocity
        coneAngle: 0.38,          // half-angle of cone in radians
        coneLength: 0.82,         // fraction of screen height
        fuelMax: 100,
        fuelDrain: 4,             // per second while beam active
        fuelRegen: 6,             // per second
        overdriveDrain: 30,       // per second
        overdriveMultiplier: 0.15,// cone narrowing
    },
    // Ships
    ships: {
        skiffSpeed: 45,
        merchantSpeed: 22,
        skiffFlashNeed: 0.6,      // seconds of beam contact to orient
        skiffDriftTime: 5.0,      // seconds before needing re-flash
        merchantGuideRate: 0.015, // progress per second under beam
        merchantDriftRate: -0.003,// progress lost per second without beam
    },
    // Creatures
    creatures: {
        lurkerSpeed: 30,
        lurkerFleeSpeed: 80,
        lurkerFleeDuration: 2.0,
    },
    // Night
    night: {
        duration: 120,   // seconds
        dawnTransition: 3.0,
    },
    // Colors
    colors: {
        darkWater: '#0a1628',
        deepSky: '#060d1a',
        stone: '#3a3530',
        stoneLight: '#5a5548',
        beam: '#ffcc44',
        beamPale: '#fff8e0',
        beamDim: '#aa8822',
        harbor: '#ffcc44',
        lantern: '#ffaa33',
        danger: '#ff4444',
        creature: '#12081a',
        creatureEye: '#8844aa',
        wreckage: '#4a3828',
    },
    // Night configs (which entities, how many, when)
    nights: [
        { // Night 1: Just skiffs
            skiffs: 6, merchants: 0, lurkers: 0,
            spawnInterval: [8, 14],
            desc: "Night 1. The sea is calm. Guide the skiffs to harbor.",
        },
        { // Night 2: Skiffs + first Merchant
            skiffs: 4, merchants: 1, lurkers: 0,
            spawnInterval: [7, 12],
            desc: "Night 2. A merchant vessel approaches. Hold the beam steady.",
        },
        { // Night 3: Skiffs + Merchant + Lurkers
            skiffs: 5, merchants: 1, lurkers: 4,
            spawnInterval: [6, 10],
            desc: "Night 3. Something moves beneath the surface.",
        },
        { // Night 4: More of everything
            skiffs: 6, merchants: 2, lurkers: 6,
            spawnInterval: [5, 9],
            desc: "Night 4. The dark is restless tonight.",
        },
        { // Night 5: Intense
            skiffs: 8, merchants: 2, lurkers: 8,
            spawnInterval: [4, 8],
            desc: "Night 5. They know the ships are coming.",
        },
    ],
};

// ── Game State ──
const GameState = { TITLE: 0, PLAYING: 1, DAWN: 2, TRANSITION: 3, NIGHT_INTRO: 4 };
let state = GameState.TITLE;
let stateTimer = 0;
let transitionFrom = 0, transitionTo = 0, transitionDuration = 0;
let W, H;
let time = 0;
let nightNum = 0;
let nightTimer = 0;

// Audio context (lazy init)
let audioCtx = null;
function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

// ── Resize ──
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ── Input ──
const input = {
    mx: W / 2, my: H / 4,
    mouseDown: false,
    keys: {},
    touched: false,
    touchCount: 0,
    init() {
        canvas.addEventListener('mousemove', e => { this.mx = e.clientX; this.my = e.clientY; });
        canvas.addEventListener('mousedown', e => { this.mouseDown = true; this.handleClick(); });
        canvas.addEventListener('mouseup', e => { this.mouseDown = false; });
        window.addEventListener('keydown', e => {
            this.keys[e.code] = true;
            if (e.code === 'Enter' || e.code === 'Space') this.handleClick();
        });
        window.addEventListener('keyup', e => { this.keys[e.code] = false; });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            this.touched = true;
            this.touchCount = e.touches.length;
            const t = e.touches[0];
            this.mx = t.clientX; this.my = t.clientY;
            this.mouseDown = true;
            this.handleClick();
        }, { passive: false });
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const t = e.touches[0];
            this.mx = t.clientX; this.my = t.clientY;
        }, { passive: false });
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            this.mouseDown = false;
            this.touchCount = e.touches.length;
        }, { passive: false });
        window.addEventListener('blur', () => { this.keys = {}; this.mouseDown = false; });
    },
    handleClick() {
        if (state === GameState.TITLE) {
            changeState(GameState.NIGHT_INTRO, 1.0);
        } else if (state === GameState.DAWN) {
            if (stateTimer > 2.0) {
                if (nightNum < CFG.nights.length) {
                    changeState(GameState.NIGHT_INTRO, 1.0);
                } else {
                    changeState(GameState.TITLE, 1.5);
                    nightNum = 0;
                }
            }
        }
    },
    get overdrive() {
        return this.keys['Space'] || this.touchCount >= 2;
    }
};
input.init();

// ── State Transitions ──
function changeState(to, duration = 0.8) {
    transitionFrom = state;
    transitionTo = to;
    transitionDuration = duration;
    stateTimer = 0;
    state = GameState.TRANSITION;
}

function onStateEnter(s) {
    stateTimer = 0;
    if (s === GameState.NIGHT_INTRO) {
        startNight();
    }
}

// ── Perlin-ish Noise ──
const perm = new Uint8Array(512);
(function initNoise() {
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [p[i], p[j]] = [p[j], p[i]];
    }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
})();

function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function lerp(a, b, t) { return a + t * (b - a); }
function grad(hash, x, y) {
    const h = hash & 3;
    return ((h & 1) ? -x : x) + ((h & 2) ? -y : y);
}
function noise2d(x, y) {
    const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    const aa = perm[perm[xi] + yi], ab = perm[perm[xi] + yi + 1];
    const ba = perm[perm[xi + 1] + yi], bb = perm[perm[xi + 1] + yi + 1];
    return lerp(lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u),
                lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u), v);
}

// ── Easing ──
const ease = {
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2,
    outBack: t => { const c = 1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); },
    inQuad: t => t * t,
};

// ── Particle System ──
const particles = [];
const MAX_PARTICLES = 400;

function spawnParticle(x, y, opts = {}) {
    if (particles.length >= MAX_PARTICLES) return;
    const angle = opts.angle ?? Math.random() * Math.PI * 2;
    const speed = opts.speed ?? (20 + Math.random() * 60);
    particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: opts.life ?? (0.3 + Math.random() * 0.5),
        maxLife: opts.life ?? (0.3 + Math.random() * 0.5),
        size: opts.size ?? (1 + Math.random() * 3),
        color: opts.color ?? '#ffcc44',
        gravity: opts.gravity ?? 0,
        friction: opts.friction ?? 0.98,
    });
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        p.vx *= p.friction;
        p.vy *= p.friction;
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
    }
}

function renderParticles() {
    for (const p of particles) {
        const a = p.life / p.maxLife;
        const s = p.size * a;
        ctx.globalAlpha = a * 0.8;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

// ── Sound System ──
function playSound(type) {
    try {
        const ac = getAudio();
        const now = ac.currentTime;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain);
        gain.connect(ac.destination);

        switch (type) {
            case 'chime': // Ship guided
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
                osc.frequency.exponentialRampToValueAtTime(1100, now + 0.15);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
                break;

            case 'arrive': // Ship safe in harbor
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(660, now + 0.1);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
                break;

            case 'repel': // Creature hit
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
                break;

            case 'sink': // Ship lost
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.8);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.start(now); osc.stop(now + 0.8);
                break;

            case 'horn': // Merchant horn
                osc.type = 'sine';
                osc.frequency.setValueAtTime(110, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.setValueAtTime(0.06, now + 0.4);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                osc.start(now); osc.stop(now + 0.8);
                break;

            case 'bell': // Skiff bell
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.04, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
                break;

            case 'overdrive':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.04, now + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
                break;

            case 'dawn':
                osc.type = 'sine';
                osc.frequency.setValueAtTime(330, now);
                gain.gain.setValueAtTime(0.0, now);
                gain.gain.linearRampToValueAtTime(0.06, now + 0.5);
                gain.gain.linearRampToValueAtTime(0.0, now + 2.0);
                osc.start(now); osc.stop(now + 2.0);
                // Add a second note
                const osc2 = ac.createOscillator();
                const gain2 = ac.createGain();
                osc2.connect(gain2); gain2.connect(ac.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(440, now + 0.5);
                gain2.gain.setValueAtTime(0.0, now + 0.5);
                gain2.gain.linearRampToValueAtTime(0.05, now + 1.0);
                gain2.gain.linearRampToValueAtTime(0.0, now + 2.5);
                osc2.start(now + 0.5); osc2.stop(now + 2.5);
                break;
        }
    } catch(e) {}
}

// Ambient water sound (looping noise)
let ambientNode = null;
function startAmbient() {
    try {
        const ac = getAudio();
        if (ambientNode) return;
        const bufSize = ac.sampleRate * 2;
        const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
        const data = buf.getChannelData(0);
        // Brown noise (low rumble)
        let last = 0;
        for (let i = 0; i < bufSize; i++) {
            const white = Math.random() * 2 - 1;
            last = (last + (0.02 * white)) / 1.02;
            data[i] = last * 3.5;
        }
        const source = ac.createBufferSource();
        source.buffer = buf;
        source.loop = true;
        const gain = ac.createGain();
        gain.gain.value = 0.04;
        const filter = ac.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 300;
        source.connect(filter);
        filter.connect(gain);
        gain.connect(ac.destination);
        source.start();
        ambientNode = { source, gain };
    } catch(e) {}
}

// ── Lighthouse ──
const lighthouse = {
    x: 0, y: 0, // set on resize
    width: 28,
    height: 90,
};

// ── Beam ──
const beam = {
    angle: -Math.PI / 2, // pointing up
    angularVel: 0,
    fuel: CFG.beam.fuelMax,
    overdrive: false,
    overdriveActive: false,
    overdriveFlash: 0,

    update(dt) {
        // Target angle from mouse
        const dx = input.mx - lighthouse.x;
        const dy = input.my - lighthouse.y;
        let targetAngle = Math.atan2(dy, dx);

        // Clamp to upper semicircle (-PI to 0, roughly)
        if (targetAngle > 0.15) targetAngle = 0.15;
        if (targetAngle < -Math.PI - 0.15) targetAngle = -Math.PI - 0.15;

        // Angular difference
        let diff = targetAngle - this.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        // Accelerate toward target with damping
        this.angularVel += diff * CFG.beam.angularAccel * dt;
        this.angularVel *= CFG.beam.angularDamping;
        this.angularVel = Math.max(-CFG.beam.maxAngularVel, Math.min(CFG.beam.maxAngularVel, this.angularVel));
        this.angle += this.angularVel * dt;

        // Fuel
        this.overdriveActive = input.overdrive && this.fuel > 5;
        if (this.overdriveActive) {
            this.fuel -= CFG.beam.overdriveDrain * dt;
            this.overdriveFlash = 0.3;
        } else {
            this.fuel -= CFG.beam.fuelDrain * dt;
        }
        this.fuel = Math.max(0, Math.min(CFG.beam.fuelMax, this.fuel));
        this.fuel += CFG.beam.fuelRegen * dt;
        this.fuel = Math.min(CFG.beam.fuelMax, this.fuel);

        if (this.overdriveFlash > 0) this.overdriveFlash -= dt;

        // Beam particles (light scatter)
        if (Math.random() < 0.3) {
            const dist = 60 + Math.random() * this.getLength() * 0.6;
            const spread = (Math.random() - 0.5) * this.getConeAngle() * 0.5;
            const px = lighthouse.x + Math.cos(this.angle + spread) * dist;
            const py = lighthouse.y + Math.sin(this.angle + spread) * dist;
            spawnParticle(px, py, {
                speed: 5 + Math.random() * 10,
                angle: Math.random() * Math.PI * 2,
                life: 0.3 + Math.random() * 0.4,
                size: 0.5 + Math.random() * 1.5,
                color: this.fuelRatio > 0.5 ? '#fff8e0' : '#ccaa66',
                gravity: 5,
            });
        }
    },

    get fuelRatio() { return this.fuel / CFG.beam.fuelMax; },

    getConeAngle() {
        const base = CFG.beam.coneAngle * (0.7 + this.fuelRatio * 0.3);
        return this.overdriveActive ? base * CFG.beam.overdriveMultiplier : base;
    },

    getLength() {
        const base = H * CFG.beam.coneLength * (0.6 + this.fuelRatio * 0.4);
        return this.overdriveActive ? base * 1.3 : base;
    },

    isPointIlluminated(px, py) {
        const dx = px - lighthouse.x;
        const dy = py - lighthouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const len = this.getLength();
        if (dist > len) return 0;

        let angleToPoint = Math.atan2(dy, dx);
        let diff = angleToPoint - this.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;

        const cone = this.getConeAngle();
        if (Math.abs(diff) > cone) return 0;

        // Intensity: brighter near center, dimmer at edges and distance
        const angleFactor = 1 - Math.abs(diff) / cone;
        const distFactor = 1 - (dist / len);
        return angleFactor * distFactor * this.fuelRatio;
    },

    render() {
        const len = this.getLength();
        const cone = this.getConeAngle();
        const fr = this.fuelRatio;

        // Flicker at low fuel
        let flickerAlpha = 1;
        if (fr < 0.25) {
            flickerAlpha = 0.5 + Math.random() * 0.5;
        } else if (fr < 0.5) {
            flickerAlpha = 0.8 + Math.sin(time * 12) * 0.1;
        }

        ctx.save();
        ctx.translate(lighthouse.x, lighthouse.y);

        // The cone
        const a1 = this.angle - cone;
        const a2 = this.angle + cone;

        // Volumetric layers
        for (let layer = 3; layer >= 0; layer--) {
            const layerCone = cone * (1 + layer * 0.08);
            const layerLen = len * (1 - layer * 0.05);
            const alpha = (0.04 + layer * 0.02) * flickerAlpha * (0.5 + fr * 0.5);

            const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, layerLen);
            const beamColor = fr > 0.5 ? CFG.colors.beam : CFG.colors.beamDim;
            grad.addColorStop(0, `rgba(255,204,68,${alpha * 2})`);
            grad.addColorStop(0.4, `rgba(255,240,200,${alpha})`);
            grad.addColorStop(1, `rgba(255,240,200,0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, layerLen, this.angle - layerCone, this.angle + layerCone);
            ctx.closePath();
            ctx.fill();
        }

        // Bright center line
        ctx.strokeStyle = `rgba(255,248,224,${0.15 * flickerAlpha * fr})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(this.angle) * len * 0.9, Math.sin(this.angle) * len * 0.9);
        ctx.stroke();

        // Water caustic ellipse at beam end
        const endX = Math.cos(this.angle) * len * 0.7;
        const endY = Math.sin(this.angle) * len * 0.7;
        ctx.fillStyle = `rgba(255,220,120,${0.03 * flickerAlpha * fr})`;
        ctx.beginPath();
        ctx.ellipse(endX, endY, 40 + cone * 100, 15, this.angle, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Overdrive flash
        if (this.overdriveFlash > 0) {
            ctx.fillStyle = `rgba(255,248,224,${this.overdriveFlash * 0.1})`;
            ctx.fillRect(0, 0, W, H);
        }
    },
};

// ── Ships ──
let ships = [];

function spawnShip(type) {
    // Spawn from edges, heading roughly toward harbor
    const side = Math.random() < 0.5 ? -1 : 1;
    const edge = Math.random();
    let x, y, targetAngle;

    if (edge < 0.6) {
        // From sides
        x = side > 0 ? W + 20 : -20;
        y = H * (0.1 + Math.random() * 0.4);
        targetAngle = side > 0 ? Math.PI + (Math.random() - 0.5) * 0.6 : (Math.random() - 0.5) * 0.6;
    } else {
        // From top
        x = W * (0.15 + Math.random() * 0.7);
        y = -20;
        targetAngle = Math.PI / 2 + (Math.random() - 0.5) * 0.5;
    }

    const ship = {
        type, // 'skiff' or 'merchant'
        x, y,
        angle: targetAngle,
        speed: type === 'skiff' ? CFG.ships.skiffSpeed : CFG.ships.merchantSpeed,
        guided: false,
        guidedTimer: 0,    // how long under beam
        driftTimer: 0,     // time since last beam contact
        progress: 0,       // 0-1 journey to harbor (merchants)
        health: 1.0,
        lanternBright: 1.0,
        hornTimer: type === 'merchant' ? 5 + Math.random() * 5 : 3 + Math.random() * 4,
        sinking: false,
        sinkTimer: 0,
        alive: true,
        saved: false,
        bobPhase: Math.random() * Math.PI * 2,
        size: type === 'merchant' ? 18 : 10,
    };

    // Merchants have a target point (harbor)
    if (type === 'merchant') {
        ship.targetX = lighthouse.x + (Math.random() - 0.5) * 80;
        ship.targetY = lighthouse.y + 10;
    }

    ships.push(ship);
}

function updateShips(dt) {
    for (const s of ships) {
        if (s.sinking) {
            s.sinkTimer += dt;
            s.y += 3 * dt;
            s.lanternBright *= 0.97;
            if (s.sinkTimer > 3) s.alive = false;
            continue;
        }

        const illumination = beam.isPointIlluminated(s.x, s.y);
        s.bobPhase += dt * 2;

        if (illumination > 0.1) {
            s.guided = true;
            s.guidedTimer += dt;
            s.driftTimer = 0;
            s.lanternBright = Math.min(1, s.lanternBright + dt * 2);

            if (s.type === 'merchant') {
                s.progress += CFG.ships.merchantGuideRate * dt * illumination * 3;
                // Steer toward harbor
                const dx = s.targetX - s.x;
                const dy = s.targetY - s.y;
                const targetA = Math.atan2(dy, dx);
                let aDiff = targetA - s.angle;
                while (aDiff > Math.PI) aDiff -= Math.PI * 2;
                while (aDiff < -Math.PI) aDiff += Math.PI * 2;
                s.angle += aDiff * 0.5 * dt;
            } else {
                // Skiff: brief flash orients, then sails toward harbor
                if (s.guidedTimer > CFG.ships.skiffFlashNeed) {
                    const dx = lighthouse.x - s.x;
                    const dy = lighthouse.y + 20 - s.y;
                    const targetA = Math.atan2(dy, dx);
                    let aDiff = targetA - s.angle;
                    while (aDiff > Math.PI) aDiff -= Math.PI * 2;
                    while (aDiff < -Math.PI) aDiff += Math.PI * 2;
                    s.angle += aDiff * 1.5 * dt;
                }
            }

            // Chime on first contact
            if (s.guidedTimer < dt * 2 && s.guidedTimer > 0) {
                playSound('chime');
            }
        } else {
            s.driftTimer += dt;
            if (s.type === 'merchant') {
                s.progress += CFG.ships.merchantDriftRate * dt;
                s.progress = Math.max(0, s.progress);
                // Drift off course
                s.angle += (Math.random() - 0.5) * 0.3 * dt;
            } else {
                // Skiff drifts after a while
                if (s.driftTimer > CFG.ships.skiffDriftTime) {
                    s.guidedTimer = 0;
                    s.angle += (Math.random() - 0.5) * 0.4 * dt;
                }
            }
            s.lanternBright = Math.max(0.2, s.lanternBright - dt * 0.5);
        }

        // Move
        s.x += Math.cos(s.angle) * s.speed * dt;
        s.y += Math.sin(s.angle) * s.speed * dt;

        // Horn/bell timer
        s.hornTimer -= dt;
        if (s.hornTimer <= 0) {
            s.hornTimer = s.type === 'merchant' ? 6 + Math.random() * 4 : 4 + Math.random() * 3;
            if (s.type === 'merchant') playSound('horn');
            else playSound('bell');
        }

        // Check if reached harbor (near lighthouse base)
        const distToHarbor = Math.sqrt((s.x - lighthouse.x) ** 2 + (s.y - lighthouse.y) ** 2);
        if (distToHarbor < 50 && s.y > lighthouse.y - 30) {
            s.saved = true;
            s.alive = false;
            nightStats.saved++;
            if (s.type === 'merchant') nightStats.merchantsSaved++;
            harborGlow += 0.15;
            playSound('arrive');
            // Celebration particles
            for (let i = 0; i < 8; i++) {
                spawnParticle(s.x, s.y, {
                    speed: 20 + Math.random() * 40,
                    color: '#ffcc44',
                    life: 0.5 + Math.random() * 0.5,
                    gravity: -10,
                });
            }
        }

        // Check if out of bounds (lost)
        if (s.x < -60 || s.x > W + 60 || s.y > H + 60) {
            if (!s.saved) {
                s.alive = false;
                nightStats.lost++;
                playSound('sink');
            }
        }

        // Damage from creatures
        if (s.health <= 0 && !s.sinking) {
            s.sinking = true;
            s.speed = 0;
            nightStats.lost++;
            playSound('sink');
        }
    }

    ships = ships.filter(s => s.alive);
}

function renderShips() {
    for (const s of ships) {
        const ill = beam.isPointIlluminated(s.x, s.y);
        const vis = Math.max(0.05, ill * 0.8 + 0.2 * s.lanternBright);
        const bob = Math.sin(s.bobPhase) * 2;

        ctx.save();
        ctx.translate(s.x, s.y + bob);
        ctx.rotate(s.angle + Math.sin(s.bobPhase * 0.7) * 0.05);
        ctx.globalAlpha = s.sinking ? Math.max(0, 1 - s.sinkTimer / 3) : 1;

        if (s.type === 'merchant') {
            // Hull
            ctx.fillStyle = `rgba(80,70,55,${vis})`;
            ctx.beginPath();
            ctx.moveTo(-s.size, 0);
            ctx.lineTo(-s.size * 0.8, s.size * 0.5);
            ctx.lineTo(s.size * 0.8, s.size * 0.5);
            ctx.lineTo(s.size, 0);
            ctx.lineTo(s.size * 0.7, -s.size * 0.3);
            ctx.lineTo(-s.size * 0.7, -s.size * 0.3);
            ctx.closePath();
            ctx.fill();
            // Mast
            ctx.strokeStyle = `rgba(100,90,70,${vis})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -s.size * 0.3);
            ctx.lineTo(0, -s.size * 1.2);
            ctx.stroke();
            // Sail
            ctx.fillStyle = `rgba(180,170,150,${vis * 0.6})`;
            ctx.beginPath();
            ctx.moveTo(0, -s.size * 1.1);
            ctx.lineTo(s.size * 0.6, -s.size * 0.5);
            ctx.lineTo(0, -s.size * 0.4);
            ctx.closePath();
            ctx.fill();
        } else {
            // Skiff: small boat
            ctx.fillStyle = `rgba(90,80,60,${vis})`;
            ctx.beginPath();
            ctx.ellipse(0, 0, s.size, s.size * 0.4, 0, 0, Math.PI);
            ctx.fill();
            ctx.fillStyle = `rgba(70,60,45,${vis})`;
            ctx.fillRect(-1, -s.size * 0.5, 2, s.size * 0.4);
        }

        // Lantern
        const lanternGlow = s.lanternBright * (0.8 + Math.sin(time * 3 + s.bobPhase) * 0.2);
        ctx.fillStyle = `rgba(255,170,50,${lanternGlow * vis})`;
        ctx.beginPath();
        ctx.arc(0, -s.size * (s.type === 'merchant' ? 0.3 : 0.5), 2 + lanternGlow, 0, Math.PI * 2);
        ctx.fill();
        // Lantern glow halo
        ctx.fillStyle = `rgba(255,170,50,${lanternGlow * vis * 0.15})`;
        ctx.beginPath();
        ctx.arc(0, -s.size * (s.type === 'merchant' ? 0.3 : 0.5), 8 + lanternGlow * 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Distress indicator (when drifting too long)
        if (s.driftTimer > 3 && !s.sinking && s.type === 'merchant') {
            const blink = Math.sin(time * 8) > 0;
            if (blink) {
                ctx.fillStyle = `rgba(255,80,80,0.6)`;
                ctx.beginPath();
                ctx.arc(s.x, s.y - 25 + bob, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }
}

// ── Creatures ──
let creatures = [];

function spawnCreature(type) {
    const angle = -Math.PI * (0.1 + Math.random() * 0.8); // upper semicircle
    const dist = Math.max(W, H) * 0.6 + Math.random() * 200;
    const x = lighthouse.x + Math.cos(angle) * dist;
    const y = lighthouse.y + Math.sin(angle) * dist;

    creatures.push({
        type,
        x, y,
        vx: 0, vy: 0,
        speed: CFG.creatures.lurkerSpeed,
        fleeing: false,
        fleeTimer: 0,
        alive: true,
        phase: Math.random() * Math.PI * 2,
        size: 12 + Math.random() * 6,
        targetShip: null,
    });
}

function updateCreatures(dt) {
    for (const c of creatures) {
        c.phase += dt * 3;
        const ill = beam.isPointIlluminated(c.x, c.y);

        if (ill > 0.2 && !c.fleeing) {
            // Flee from beam
            c.fleeing = true;
            c.fleeTimer = CFG.creatures.lurkerFleeDuration;
            const awayAngle = Math.atan2(c.y - lighthouse.y, c.x - lighthouse.x);
            c.vx = Math.cos(awayAngle) * CFG.creatures.lurkerFleeSpeed;
            c.vy = Math.sin(awayAngle) * CFG.creatures.lurkerFleeSpeed;
            playSound('repel');
            // Repel particles
            for (let i = 0; i < 5; i++) {
                spawnParticle(c.x, c.y, {
                    speed: 30 + Math.random() * 40,
                    angle: awayAngle + (Math.random() - 0.5) * 1,
                    color: '#8844aa',
                    life: 0.3,
                    size: 2,
                });
            }
        }

        if (c.fleeing) {
            c.fleeTimer -= dt;
            c.x += c.vx * dt;
            c.y += c.vy * dt;
            c.vx *= 0.97;
            c.vy *= 0.97;
            if (c.fleeTimer <= 0) {
                c.fleeing = false;
            }
        } else {
            // Find nearest ship to target
            let nearestDist = Infinity;
            c.targetShip = null;
            for (const s of ships) {
                if (s.sinking) continue;
                const d = Math.sqrt((c.x - s.x) ** 2 + (c.y - s.y) ** 2);
                if (d < nearestDist) { nearestDist = d; c.targetShip = s; }
            }

            if (c.targetShip) {
                const dx = c.targetShip.x - c.x;
                const dy = c.targetShip.y - c.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    c.x += (dx / dist) * c.speed * dt;
                    c.y += (dy / dist) * c.speed * dt;
                }

                // Damage ship on contact
                if (dist < c.size + c.targetShip.size) {
                    c.targetShip.health -= dt * 0.5;
                    // Push ship off course
                    c.targetShip.angle += (Math.random() - 0.5) * 2 * dt;
                }
            } else {
                // Drift toward lighthouse slowly
                const dx = lighthouse.x - c.x;
                const dy = lighthouse.y - c.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    c.x += (dx / dist) * c.speed * 0.5 * dt;
                    c.y += (dy / dist) * c.speed * 0.5 * dt;
                }
            }

            // Organic undulation
            c.x += Math.sin(c.phase) * 8 * dt;
            c.y += Math.cos(c.phase * 0.7) * 5 * dt;
        }

        // Out of bounds
        if (c.x < -200 || c.x > W + 200 || c.y < -200 || c.y > H + 200) {
            c.alive = false;
        }
    }

    creatures = creatures.filter(c => c.alive);
}

function renderCreatures() {
    for (const c of creatures) {
        const ill = beam.isPointIlluminated(c.x, c.y);
        const vis = Math.max(0.03, ill * 0.7);
        const undulate = Math.sin(c.phase) * 3;

        ctx.save();
        ctx.translate(c.x, c.y + undulate);
        ctx.globalAlpha = vis;

        // Body: dark organic shape
        ctx.fillStyle = CFG.colors.creature;
        ctx.beginPath();
        const segments = 8;
        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const a = t * Math.PI * 2;
            const r = c.size * (0.8 + Math.sin(a * 3 + c.phase) * 0.2);
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        // Eyes (only visible when illuminated)
        if (ill > 0.3) {
            ctx.fillStyle = CFG.colors.creatureEye;
            ctx.globalAlpha = ill * 0.8;
            ctx.beginPath();
            ctx.arc(-3, -2, 2, 0, Math.PI * 2);
            ctx.arc(3, -2, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.restore();
    }
}

// ── Night Stats ──
let nightStats = { saved: 0, lost: 0, merchantsSaved: 0, creaturesRepelled: 0 };
let harborGlow = 0.1;
let wreckage = [];

function resetNightStats() {
    nightStats = { saved: 0, lost: 0, merchantsSaved: 0, creaturesRepelled: 0 };
}

// ── Spawn Manager ──
let spawnTimer = 0;
let spawnQueue = [];

function buildSpawnQueue(nightCfg) {
    const q = [];
    for (let i = 0; i < nightCfg.skiffs; i++) q.push({ type: 'skiff', entity: 'ship' });
    for (let i = 0; i < nightCfg.merchants; i++) q.push({ type: 'merchant', entity: 'ship' });
    for (let i = 0; i < nightCfg.lurkers; i++) q.push({ type: 'lurker', entity: 'creature' });
    // Shuffle
    for (let i = q.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [q[i], q[j]] = [q[j], q[i]];
    }
    return q;
}

function startNight() {
    const cfg = CFG.nights[nightNum];
    ships = [];
    creatures = [];
    particles.length = 0;
    wreckage = [];
    beam.fuel = CFG.beam.fuelMax;
    beam.angle = -Math.PI / 2;
    beam.angularVel = 0;
    harborGlow = 0.1;
    nightTimer = 0;
    resetNightStats();
    spawnQueue = buildSpawnQueue(cfg);
    spawnTimer = 3; // first spawn after 3 seconds
    startAmbient();
}

// ── Rendering Helpers ──

function renderWater() {
    // Deep gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, CFG.colors.deepSky);
    grad.addColorStop(0.4, '#0b1830');
    grad.addColorStop(1, CFG.colors.darkWater);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Animated noise on water surface
    ctx.globalAlpha = 0.04;
    const scale = 0.008;
    const t = time * 0.15;
    for (let x = 0; x < W; x += 20) {
        for (let y = H * 0.3; y < H; y += 20) {
            const n = noise2d(x * scale + t, y * scale + t * 0.5);
            const brightness = (n + 1) * 0.5;
            ctx.fillStyle = `rgba(100,140,180,${brightness})`;
            ctx.fillRect(x, y, 20, 20);
        }
    }
    ctx.globalAlpha = 1;

    // Faint stars
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 40; i++) {
        const sx = ((i * 137.5) % W);
        const sy = ((i * 97.3) % (H * 0.35));
        const twinkle = 0.2 + Math.sin(time * (1 + i * 0.1) + i) * 0.15;
        ctx.globalAlpha = twinkle;
        ctx.beginPath();
        ctx.arc(sx, sy, 0.5 + (i % 3) * 0.3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function renderLighthouse() {
    const lx = lighthouse.x;
    const ly = lighthouse.y;
    const lw = lighthouse.width;
    const lh = lighthouse.height;

    ctx.save();
    ctx.translate(lx, ly);

    // Tower body
    const stoneGrad = ctx.createLinearGradient(-lw/2, -lh, lw/2, 0);
    stoneGrad.addColorStop(0, CFG.colors.stoneLight);
    stoneGrad.addColorStop(0.5, CFG.colors.stone);
    stoneGrad.addColorStop(1, '#2a2520');
    ctx.fillStyle = stoneGrad;
    ctx.beginPath();
    ctx.moveTo(-lw / 2, 0);
    ctx.lineTo(-lw / 2.5, -lh);
    ctx.lineTo(lw / 2.5, -lh);
    ctx.lineTo(lw / 2, 0);
    ctx.closePath();
    ctx.fill();

    // Stripes
    ctx.fillStyle = 'rgba(180,40,40,0.4)';
    for (let i = 0; i < 3; i++) {
        const sy = -lh * (0.2 + i * 0.25);
        const sw = lw * (0.85 - i * 0.05);
        ctx.fillRect(-sw / 2, sy, sw, lh * 0.08);
    }

    // Lantern room at top
    ctx.fillStyle = '#555045';
    ctx.fillRect(-lw / 3, -lh - 12, lw / 1.5, 14);

    // Light source glow
    const glowSize = 12 + Math.sin(time * 2) * 2;
    const fr = beam.fuelRatio;
    ctx.fillStyle = `rgba(255,204,68,${0.6 * fr})`;
    ctx.beginPath();
    ctx.arc(0, -lh - 5, glowSize, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,248,224,${0.3 * fr})`;
    ctx.beginPath();
    ctx.arc(0, -lh - 5, glowSize * 2, 0, Math.PI * 2);
    ctx.fill();

    // Base rocks
    ctx.fillStyle = '#1a1a18';
    for (let i = -3; i <= 3; i++) {
        const rx = i * 12 + Math.sin(i * 2) * 4;
        const ry = 5 + Math.abs(i) * 3;
        ctx.beginPath();
        ctx.ellipse(rx, ry, 10 + Math.abs(i) * 2, 6, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function renderHarborGlow() {
    harborGlow = Math.min(1, harborGlow);
    const glow = harborGlow * (0.8 + Math.sin(time * 0.5) * 0.2);
    const grad = ctx.createRadialGradient(lighthouse.x, H, 10, lighthouse.x, H, 150);
    grad.addColorStop(0, `rgba(255,204,68,${glow * 0.15})`);
    grad.addColorStop(1, 'rgba(255,204,68,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(lighthouse.x - 160, H - 160, 320, 160);
}

function renderWreckage() {
    for (const w of wreckage) {
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = CFG.colors.wreckage;
        ctx.fillRect(w.x - 4, w.y - 2, 8, 4);
        ctx.fillRect(w.x - 1, w.y - 6, 2, 8);
    }
    ctx.globalAlpha = 1;
}

// ── Ambient Events ──
let lightningTimer = 15 + Math.random() * 30;
let lightningFlash = 0;

function updateAmbient(dt) {
    lightningTimer -= dt;
    if (lightningTimer <= 0) {
        lightningFlash = 0.15;
        lightningTimer = 20 + Math.random() * 40;
    }
    if (lightningFlash > 0) lightningFlash -= dt;

    // Occasional bioluminescent plankton
    if (Math.random() < 0.005) {
        const px = Math.random() * W;
        const py = H * 0.4 + Math.random() * H * 0.5;
        for (let i = 0; i < 3; i++) {
            spawnParticle(px + (Math.random() - 0.5) * 20, py + (Math.random() - 0.5) * 10, {
                speed: 3, color: '#44aaaa', life: 1 + Math.random(), size: 1, gravity: 0,
            });
        }
    }
}

// ── Title Screen ──
function renderTitle() {
    renderWater();

    // Lighthouse silhouette
    lighthouse.x = W / 2;
    lighthouse.y = H * 0.72;
    renderLighthouse();

    // Dim beam sweep
    const sweepAngle = -Math.PI / 2 + Math.sin(time * 0.4) * 0.6;
    ctx.save();
    ctx.translate(lighthouse.x, lighthouse.y - lighthouse.height - 5);
    const tGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, H * 0.5);
    tGrad.addColorStop(0, 'rgba(255,204,68,0.06)');
    tGrad.addColorStop(1, 'rgba(255,204,68,0)');
    ctx.fillStyle = tGrad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, H * 0.5, sweepAngle - 0.25, sweepAngle + 0.25);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Title text
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const titleY = H * 0.28;
    const pulse = 1 + Math.sin(time * 1.5) * 0.02;

    ctx.save();
    ctx.translate(W / 2, titleY);
    ctx.scale(pulse, pulse);

    // Glow
    ctx.shadowColor = '#ffcc44';
    ctx.shadowBlur = 30;
    ctx.fillStyle = '#ffcc44';
    ctx.font = `bold ${Math.min(72, W * 0.08)}px Georgia, serif`;
    ctx.fillText('LAST LIGHT', 0, 0);
    ctx.shadowBlur = 0;

    // Crisp overlay
    ctx.fillStyle = '#fff8e0';
    ctx.fillText('LAST LIGHT', 0, 0);
    ctx.restore();

    // Subtitle
    ctx.fillStyle = `rgba(180,170,150,${0.5 + Math.sin(time * 2) * 0.2})`;
    ctx.font = `${Math.min(18, W * 0.025)}px Georgia, serif`;
    ctx.fillText('A lighthouse keeper\u2019s vigil against the dark', W / 2, titleY + 50);

    // Start prompt
    const promptAlpha = 0.3 + Math.sin(time * 3) * 0.3;
    ctx.fillStyle = `rgba(255,248,224,${promptAlpha})`;
    ctx.font = `${Math.min(16, W * 0.022)}px Georgia, serif`;
    ctx.fillText(input.touched ? 'Tap to begin' : 'Click or press Enter to begin', W / 2, H * 0.6);

    // Vignette
    renderVignette();
}

function renderVignette() {
    const grad = ctx.createRadialGradient(W/2, H/2, H * 0.3, W/2, H/2, H * 0.8);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
}

// ── Night Intro ──
function renderNightIntro() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    const cfg = CFG.nights[nightNum];
    const alpha = stateTimer < 0.5 ? stateTimer / 0.5 : stateTimer > 2.5 ? 1 - (stateTimer - 2.5) / 0.5 : 1;

    ctx.globalAlpha = Math.max(0, alpha);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillStyle = '#ffcc44';
    ctx.font = `bold ${Math.min(36, W * 0.05)}px Georgia, serif`;
    ctx.fillText(`Night ${nightNum + 1}`, W / 2, H * 0.4);

    ctx.fillStyle = '#aaa8a0';
    ctx.font = `${Math.min(16, W * 0.022)}px Georgia, serif`;
    ctx.fillText(cfg.desc, W / 2, H * 0.5);

    ctx.globalAlpha = 1;

    if (stateTimer > 3.0) {
        state = GameState.PLAYING;
        onStateEnter(GameState.PLAYING);
    }
}

// ── Dawn Debrief ──
function renderDawn() {
    // Sunrise gradient
    const dawnProgress = Math.min(1, stateTimer / 3);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    const r = Math.floor(lerp(6, 60, dawnProgress));
    const g = Math.floor(lerp(13, 40, dawnProgress));
    const b = Math.floor(lerp(26, 50, dawnProgress));
    const r2 = Math.floor(lerp(10, 180, dawnProgress));
    const g2 = Math.floor(lerp(24, 120, dawnProgress));
    const b2 = Math.floor(lerp(48, 80, dawnProgress));
    grad.addColorStop(0, `rgb(${r},${g},${b})`);
    grad.addColorStop(0.5, `rgb(${r2},${g2},${b2})`);
    grad.addColorStop(1, `rgb(${Math.floor(r2*0.7)},${Math.floor(g2*0.6)},${Math.floor(b2*0.5)})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Sun on horizon
    if (dawnProgress > 0.3) {
        const sunAlpha = (dawnProgress - 0.3) / 0.7;
        const sunY = H * 0.45 - sunAlpha * H * 0.05;
        ctx.fillStyle = `rgba(255,200,100,${sunAlpha * 0.4})`;
        ctx.beginPath();
        ctx.arc(W / 2, sunY, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(255,220,150,${sunAlpha * 0.15})`;
        ctx.beginPath();
        ctx.arc(W / 2, sunY, 100, 0, Math.PI * 2);
        ctx.fill();
    }

    // Lighthouse silhouette
    renderLighthouse();

    // Harbor with saved ships
    for (let i = 0; i < nightStats.saved; i++) {
        const sx = lighthouse.x - 60 + i * 25 + Math.sin(i * 1.3) * 10;
        const sy = lighthouse.y + 20 + Math.sin(time + i) * 2;
        ctx.fillStyle = `rgba(80,70,55,${0.6 * dawnProgress})`;
        ctx.beginPath();
        ctx.ellipse(sx, sy, 8, 3, 0, 0, Math.PI);
        ctx.fill();
        ctx.fillRect(sx - 0.5, sy - 8, 1, 8);
    }

    // Wreckage on rocks
    for (let i = 0; i < nightStats.lost; i++) {
        const wx = lighthouse.x + (i % 2 === 0 ? -1 : 1) * (80 + i * 20);
        const wy = lighthouse.y + 10 + Math.sin(i * 2) * 5;
        ctx.fillStyle = `rgba(74,56,40,${0.5 * dawnProgress})`;
        ctx.fillRect(wx - 5, wy - 2, 10, 4);
        ctx.fillRect(wx - 1, wy - 7, 2, 8);
    }

    // Stats text
    if (stateTimer > 1.5) {
        const textAlpha = Math.min(1, (stateTimer - 1.5) / 1.0);
        ctx.globalAlpha = textAlpha;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.fillStyle = '#3a3530';
        ctx.font = `italic ${Math.min(16, W * 0.022)}px Georgia, serif`;
        ctx.fillText(`Night ${nightNum + 1}`, W / 2, H * 0.15);

        const total = nightStats.saved + nightStats.lost;
        let summary;
        if (nightStats.lost === 0) {
            summary = `All ${total} vessels found harbor. A perfect night.`;
        } else if (nightStats.saved === 0) {
            summary = `${total} vessels sought the light. None found harbor.`;
        } else {
            summary = `Of ${total} vessels that sought the light, ${nightStats.saved} found harbor.`;
        }

        ctx.fillStyle = '#2a2520';
        ctx.font = `${Math.min(18, W * 0.025)}px Georgia, serif`;
        ctx.fillText(summary, W / 2, H * 0.22);

        if (nightStats.lost > 0) {
            ctx.fillStyle = '#5a4838';
            ctx.font = `italic ${Math.min(14, W * 0.02)}px Georgia, serif`;
            ctx.fillText(`${nightStats.lost} met the rocks.`, W / 2, H * 0.28);
        }

        ctx.globalAlpha = 1;
    }

    // Continue prompt
    if (stateTimer > 2.0) {
        const pa = 0.3 + Math.sin(time * 3) * 0.2;
        ctx.fillStyle = `rgba(58,53,48,${pa})`;
        ctx.textAlign = 'center';
        ctx.font = `${Math.min(14, W * 0.02)}px Georgia, serif`;
        const nextText = nightNum < CFG.nights.length - 1 ? 'Click to continue' : 'Click to return';
        ctx.fillText(nextText, W / 2, H * 0.88);
    }

    renderVignette();
}

// ── Gameplay Render ──
function renderGameplay() {
    renderWater();

    // Lightning flash
    if (lightningFlash > 0) {
        ctx.fillStyle = `rgba(150,160,180,${lightningFlash})`;
        ctx.fillRect(0, 0, W, H);
    }

    renderHarborGlow();
    renderWreckage();
    renderCreatures();
    renderShips();

    // Beam renders on top of entities but below lighthouse
    lighthouse.x = W / 2;
    lighthouse.y = H * 0.82;
    beam.render();

    renderLighthouse();
    renderParticles();
    renderVignette();

    // Night timer (subtle)
    if (nightTimer > 0) {
        const remaining = Math.max(0, CFG.night.duration - nightTimer);
        if (remaining < 20) {
            const urgency = 1 - remaining / 20;
            ctx.fillStyle = `rgba(255,200,100,${urgency * 0.05})`;
            ctx.fillRect(0, 0, W, H);
        }
    }
}

// ── Main Update ──
function updateGameplay(dt) {
    nightTimer += dt;
    beam.update(dt);
    updateShips(dt);
    updateCreatures(dt);
    updateParticles(dt);
    updateAmbient(dt);

    // Spawn logic
    const cfg = CFG.nights[nightNum];
    if (spawnQueue.length > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
            const next = spawnQueue.shift();
            if (next.entity === 'ship') spawnShip(next.type);
            else spawnCreature(next.type);
            const [minI, maxI] = cfg.spawnInterval;
            spawnTimer = minI + Math.random() * (maxI - minI);
        }
    }

    // Night end check: all spawned and all ships resolved
    if (spawnQueue.length === 0 && ships.length === 0 && nightTimer > 10) {
        nightNum++;
        playSound('dawn');
        changeState(GameState.DAWN, 1.5);
    }

    // Also end if timer runs out
    if (nightTimer >= CFG.night.duration) {
        nightNum++;
        playSound('dawn');
        changeState(GameState.DAWN, 1.5);
    }
}

// ── Game Loop ──
const TICK = 1 / 60;
let acc = 0;
let prevTime = 0;

function loop(ts) {
    requestAnimationFrame(loop);

    const dt = Math.min((ts - prevTime) / 1000, 0.1);
    prevTime = ts;
    time += dt;
    stateTimer += dt;

    // Update
    if (state === GameState.PLAYING) {
        acc += dt;
        while (acc >= TICK) {
            updateGameplay(TICK);
            acc -= TICK;
        }
    }

    // Render
    ctx.clearRect(0, 0, W, H);

    switch (state) {
        case GameState.TITLE:
            renderTitle();
            break;
        case GameState.PLAYING:
            renderGameplay();
            break;
        case GameState.DAWN:
            renderDawn();
            break;
        case GameState.NIGHT_INTRO:
            renderNightIntro();
            break;
        case GameState.TRANSITION:
            const progress = Math.min(1, stateTimer / transitionDuration);
            // Fade through black
            if (progress < 0.5) {
                // Render old state fading out
                renderState(transitionFrom);
                ctx.fillStyle = `rgba(0,0,0,${ease.inQuad(progress * 2)})`;
                ctx.fillRect(0, 0, W, H);
            } else {
                // Render new state fading in
                renderState(transitionTo);
                ctx.fillStyle = `rgba(0,0,0,${1 - ease.outCubic((progress - 0.5) * 2)})`;
                ctx.fillRect(0, 0, W, H);
            }
            if (progress >= 1) {
                state = transitionTo;
                onStateEnter(transitionTo);
            }
            break;
    }

    // Custom cursor
    if (state === GameState.PLAYING) {
        ctx.strokeStyle = `rgba(255,248,224,${0.3 + beam.fuelRatio * 0.3})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(input.mx, input.my, 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(input.mx, input.my - 3);
        ctx.lineTo(input.mx, input.my + 3);
        ctx.moveTo(input.mx - 3, input.my);
        ctx.lineTo(input.mx + 3, input.my);
        ctx.stroke();
    }
}

function renderState(s) {
    switch (s) {
        case GameState.TITLE: renderTitle(); break;
        case GameState.PLAYING: renderGameplay(); break;
        case GameState.DAWN: renderDawn(); break;
        case GameState.NIGHT_INTRO: renderNightIntro(); break;
    }
}

// ── Initialize ──
lighthouse.x = W / 2;
lighthouse.y = H * 0.82;
requestAnimationFrame(loop);

</script>
